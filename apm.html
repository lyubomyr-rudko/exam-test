<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:20px;line-height:1.45}

<script>
const EXAM = {"title":"Datadog APM and Distributed Tracing Fundamentals","questionCount":180,"questions":[{"id":1,"question":"What is the purpose of Datadog's APM and observability platform?","type":"single_choice","options":[{"id":"A","text":"To detect, troubleshoot, and resolve issues faster with end-to-end distributed tracing and service- centric observability at scale."},{"id":"B","text":"To provide a unified query language for monitoring and observability."},{"id":"C","text":"To provide a centralized repository for code deployments."},{"id":"D","text":"To offer automatic version tagging and deployment tracking for code releases."}],"correctAnswers":["A"],"answerExplanation":"Datadog explains that the purpose of their APM and observability platform is to detect, troubleshoot, and resolve issues faster. The rest of the choices would be explanations of how Datadog is able to achieve that purpose. See: https://www.datadoghq.com/dg/apm/benefits-os-b/"},{"id":2,"question":"Which Anomaly Monitor algorithm is recommended when APM metrics have no repeating seasonal pattern?","type":"single_choice","options":[{"id":"A","text":"Basic"},{"id":"B","text":"Agile"},{"id":"C","text":"Robust"},{"id":"D","text":"None of the choices."}],"correctAnswers":["A"],"answerExplanation":"Basic is recommended for metrics with no repeating seasonal pattern. See: https://docs.datadoghq.com/monitors/types/anomaly/#anomaly-detection-algorithms"},{"id":3,"question":"How do you configure the primary operation of a service?","type":"single_choice","options":[{"id":"A","text":"In the APM Settings Page, set the primary operations manually."},{"id":"B","text":"In the APM Settings Page, set the second primary tag."},{"id":"C","text":"The primary operation of a service is defined automatically and cannot be modified."}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/guide/configuring-primary-operation/#configuration"},{"id":4,"question":"What is the benefit of integrating distributed tracing with code stack trace benchmarks from profiling?","type":"single_choice","options":[{"id":"A","text":"To identify the performance bottlenecks"},{"id":"B","text":"To improve the application's performance"},{"id":"C","text":"To eliminate the performance issues in production"},{"id":"D","text":"To track service dependencies"}],"correctAnswers":["A"],"answerExplanation":"Distributed tracing captures the timing of requests. Profiling and code hotspots enables you to drill down to the methods of your code to identify the performance bottlenecks. See: https://docs.datadoghq.com/profiler/connect_traces_and_profiles/"},{"id":5,"question":"How do you get alerted when your service has a high error rate?","type":"single_choice","options":[{"id":"A","text":"Create a monitor."},{"id":"B","text":"Create a dashboard."},{"id":"C","text":"Create an SLO."},{"id":"D","text":"Use the trace explorer."}],"correctAnswers":["A"],"answerExplanation":"Monitors are used to send alerts. More information on APM Monitors here: https://docs.datadoghq.com/monitors/types/apm/"},{"id":6,"question":"What's the difference between APM metric monitors and APM trace analytics monitors?","type":"single_choice","options":[{"id":"A","text":"APM metric monitors work like regular metric monitors. Trace analytics monitors set up alerts based on indexed spans."},{"id":"B","text":"APM metric monitors set up alerts based on indexed spans. Trace analytics monitors set up alerts based on ingested spans."},{"id":"C","text":"APM metric monitors work on metrics from spans only. Trace analytics monitors set up alerts based on all spans."},{"id":"D","text":"APM metric monitors are limited to 1000 per account. Trace analytics monitors are unlimited."}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/monitors/types/apm/"},{"id":7,"question":"An APM Live Search query can be used to do which of the following?","type":"single_choice","options":[{"id":"A","text":"Export to monitor"},{"id":"B","text":"Export to dashboard"},{"id":"C","text":"Export to notebook"},{"id":"D","text":"Generate new metric"}],"correctAnswers":["D"],"answerExplanation":"The only option is generating a new metric."},{"id":8,"question":"Which of the following queries representa services with names starting with store-frontend?","type":"single_choice","options":[{"id":"A","text":"service:store-frontend*"},{"id":"B","text":"service:store-frontend?"},{"id":"C","text":"service:store-frontend"},{"id":"D","text":"service:store-frontend..."}],"correctAnswers":["A"],"answerExplanation":"To scope to all services beginning with store-frontend, you need to use a * at the end."},{"id":9,"question":"What's the best way to find out the reason for the 500 errors when filtering for status: error in the Live Search view?","type":"single_choice","options":[{"id":"A","text":"Click on one span. Then click on the errors tab."},{"id":"B","text":"Click on one span. Then click on the span summary."},{"id":"C","text":"Left click on span to navigate to the service map."},{"id":"D","text":"Check the upstream and downstream services."}],"correctAnswers":["A"],"answerExplanation":"The stack trace is captured and displayed in the error tab of the trace panel."},{"id":10,"question":"You are the owner of the Payment API service. The frontend team gave the feedback that the Payment API takes 5 seconds to reply for some of their calls. How do you query for this on the trace explorer?","type":"single_choice","options":[{"id":"A","text":"service:payment-api @duration:>=5s"},{"id":"B","text":"service:payment-api @duration:5s"},{"id":"C","text":"service:payment-api @duration:high"},{"id":"D","text":"service:payment-api @duration:p95"}],"correctAnswers":["A"],"answerExplanation":"You can leverage the duration attribute to investigate latencies. For more information on the query syntax, see: https://docs.datadoghq.com/tracing/trace_explorer/query_syntax/"},{"id":11,"question":"Your e-commerce website had an issue with the checkouts last week. You would like to offer a discount to the 10 users who encountered the most errors. How do you accomplish this in Datadog APM assuming you have a custom tag for customer emails?","type":"single_choice","options":[{"id":"A","text":"On the trace explorer page, make a query scoping down to the service, checkout resource, and errors. Use the customer email for grouping. Visualize using a top list and limit the view to 10."},{"id":"B","text":"On the trace explorer page, make a query scoping down to the service, checkout resource, and customer email. Use the HTTP Status Code for grouping. Visualize using a top list and limit the view to 10."},{"id":"C","text":"On the trace explorer page, make a query scoping down to the customer email and errors. Use the service name and checkout resource name for grouping. Visualize using a top list and limit the view to 10."}],"correctAnswers":["A"],"answerExplanation":"The key is to use Customer Email for grouping the errors. This is the example in the Datadog documentation here: https://docs.datadoghq.com/tracing/trace_explorer/visualize/#top-list"},{"id":12,"question":"The Apdex is set per which entity in Datadog APM?","type":"single_choice","options":[{"id":"A","text":"Service"},{"id":"B","text":"Resource"},{"id":"C","text":"Span"},{"id":"D","text":"Trace"}],"correctAnswers":["A"],"answerExplanation":"Apdex is defined per service on the service page. See: https://docs.datadoghq.com/tracing/guide/configure_an_apdex_for_your_traces_with_datadog_apm/#set -your-apdex-for-your-traces"},{"id":13,"question":"Which service type supports configuring the Apdex?","type":"single_choice","options":[{"id":"A","text":"Web"},{"id":"B","text":"DB"},{"id":"C","text":"Function"},{"id":"D","text":"Cache"},{"id":"E","text":"Custom"}],"correctAnswers":["A"],"answerExplanation":"Apdex or Application Performance Index is an open standard that defines a standardized method to report, benchmark, and track application performance. It is based on the response time of web applications and services. See: https://docs.datadoghq.com/tracing/guide/configure_an_apdex_for_your_traces_with_datadog_apm/"},{"id":14,"question":"Which permission do you need to be able to set the Apdex score?","type":"single_choice","options":[{"id":"A","text":"Datadog Admin Role"},{"id":"B","text":"Datadog Standard Role"},{"id":"C","text":"Datadog Admin Role or Datadog Standard Role"},{"id":"D","text":"Datadog Read Only Role"}],"correctAnswers":["A"],"answerExplanation":"You need to be an administrator of your Datadog account to define your Apdex. See: https://docs.datadoghq.com/tracing/guide/configure_an_apdex_for_your_traces_with_datadog_apm/#def inition"},{"id":15,"question":"You own the Payments API which is a critical service. Your manager would like you to show the day- to-day count of requests to the Post Payment endpoint that are successful but responded with medium latency. Medium latency is 1 to 3 seconds, and the manager would like to compare 3 months worth of data going forward. How can you accomplish this with Datadog APM features?","type":"single_choice","options":[{"id":"A","text":"Generate metrics from spans"},{"id":"B","text":"Leverage trace metrics"},{"id":"C","text":"Make a saved view on trace explorer"},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["A"],"answerExplanation":"This use case requires creating custom metrics from spans. Default trace metrics do not contain the business logic required, and the trace explorer would not have months long of data by default. More information on generating metrics from spans here: https://docs.datadoghq.com/tracing/trace_pipeline/generate_metrics/"},{"id":16,"question":"How can you update an existing span-based metric?","type":"single_choice","options":[{"id":"A","text":"Change the metric type or name."},{"id":"B","text":"Change the stream filter query."},{"id":"C","text":"Change the aggregation groups or dimensions."},{"id":"D","text":"Both changing the stream filter query and the aggregation groups or dimensions."}],"correctAnswers":["D"],"answerExplanation":"After a span-based metric is created, only the stream filter query and the aggregation groups can be updated. To change the metric type or name, a new metric must be created and the old one deleted. See: https://docs.datadoghq.com/tracing/trace_pipeline/generate_metrics/#updating-existing-span- based-metri cs"},{"id":17,"question":"What are span-based metrics?","type":"single_choice","options":[{"id":"A","text":"Metrics generated from 100% of ingested spans."},{"id":"B","text":"Metrics generated from indexed spans only."},{"id":"C","text":"Metrics generated from unindexed spans only."},{"id":"D","text":"Metrics generated from 50% of ingested spans."}],"correctAnswers":["A"],"answerExplanation":"Span-based metrics are generated from 100% of ingested spans, regardless of whether the spans are indexed by a retention filter. See: https://docs.datadoghq.com/tracing/trace_pipeline/generate_metrics/"},{"id":18,"question":"Which widget is best for showing key metrics of an APM service in a dashboard?","type":"single_choice","options":[{"id":"A","text":"Service Summary Widget"},{"id":"B","text":"Service Map Widget"},{"id":"C","text":"Distribution Widget"},{"id":"D","text":"Check Status Widget"}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/dashboards/widgets/service_summary/"},{"id":19,"question":"Which of the following trace metrics represent the count of errors for rack.request spans?","type":"single_choice","options":[{"id":"A","text":"trace.rack.request.errors"},{"id":"B","text":"trace.rack.request.hits"},{"id":"C","text":"trace.rack.request.misses"},{"id":"D","text":"trace.rack.request.exceptions"},{"id":"E","text":"trace.rack.request"}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/metrics/metrics_namespace/#errors"},{"id":20,"question":"The following are benefits of using Datadog's APM and observability platform except?","type":"single_choice","options":[{"id":"A","text":"Easily identify bottlenecks with full-stack distributed tracing, continuous profiling, and real user monitoring"},{"id":"B","text":"Automatically collect, monitor, and visualize high-granularity data and custom metrics in real time"},{"id":"C","text":"Continuously analyze and compare code performance in any environment, including production"},{"id":"D","text":"All of the choices are correct."}],"correctAnswers":["D"],"answerExplanation":"See: https://www.datadoghq.com/dg/apm/benefits-os-b/"},{"id":21,"question":"You've finished setting up distributed tracing using automatic instrumentation. You shared the output to your internal stakeholders and their feedback is that the time spent on each component is not granular enough. The stakeholders would like to see more detail. What should you do?","type":"single_choice","options":[{"id":"A","text":"Add a custom span for missing components."},{"id":"B","text":"Add more detailed attributes to existing spans."},{"id":"C","text":"Adjust the automatic instrumentation level to high."},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["A"],"answerExplanation":"If you would like additional depth in your application’s traces, you may want to add custom instrumentation to your code for complete flame graphs or to measure execution times for pieces of code. See: https://docs.datadoghq.com/tracing/trace_collection/custom_instrumentation/java/#adding-spans"},{"id":22,"question":"How do you temporarily disable a retention filter?","type":"single_choice","options":[{"id":"A","text":"In the Retention Filters tab, use the Enabled toggle."},{"id":"B","text":"In the Retention Filters tab, modify the filter query."},{"id":"C","text":"In the Retention Filters tab, delete the retention filter."},{"id":"D","text":"In the Retention Filters tab, move the retention filter to the bottom."}],"correctAnswers":["A"],"answerExplanation":"The Retention Filter tab has an Enable toggle. See: https://docs.datadoghq.com/tracing/trace_pipeline/trace_retention/#retention-filters"},{"id":23,"question":"Where can you set the sampling rates for head-based sampling?","type":"single_choice","options":[{"id":"A","text":"At the Tracing Library level"},{"id":"B","text":"At the Agent level"},{"id":"C","text":"Both at the Agent and Tracing Library levels"},{"id":"D","text":"Not possible to set sampling rates for head-based sampling"}],"correctAnswers":["C"],"answerExplanation":"You can set sampling rates for head-based sampling at the Agent level and at the Tracing Library level. See: https://docs.datadoghq.com/tracing/trace_pipeline/ingestion_mechanisms/?tab=java#head-based- sampling"},{"id":24,"question":"Setting DD_TRACE_SAMPLE_RATE affects which distributed tracing functionality?","type":"single_choice","options":[{"id":"A","text":"Ingestion"},{"id":"B","text":"Retention"},{"id":"C","text":"Indexing"},{"id":"D","text":"Searching"}],"correctAnswers":["A"],"answerExplanation":"DD_TRACE_SAMPLE_RATE is set on the tracing library for controlling head-based sampling. If the traffic for a service is higher than the configured maximum traces per second, then traces are dropped at the root. See: https://docs.datadoghq.com/tracing/trace_pipeline/ingestion_mechanisms/?tab=java#in-tracing- libraries-user-defined-rules"},{"id":25,"question":"What sampling percentage will take effect if you set DD_TRACE_SAMPLE_RATE to 0.2","type":"single_choice","options":[{"id":"A","text":"20%"},{"id":"B","text":"0.20%"},{"id":"C","text":"2%"},{"id":"D","text":"0%"}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/trace_pipeline/ingestion_mechanisms/?tab=java"},{"id":26,"question":"Traces can be submitted to the Agent from other containers by using which of the following?","type":"single_choice","options":[{"id":"A","text":"Docker network"},{"id":"B","text":"Docker host IP"},{"id":"C","text":"Both Docker network and Docker host IP"},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["C"],"answerExplanation":"Traces can be submitted to the Agent from other containers either using Docker networks or with the Docker host IP. See: https://docs.datadoghq.com/containers/docker/apm/?tab=linux#tracing-from-other-containers"},{"id":27,"question":"When setting up the Datadog Agent on Kubernetes via Helm chart, the Agent is already configured to receive traces by which of the following?","type":"single_choice","options":[{"id":"A","text":"TCP (IP:Port)"},{"id":"B","text":"Unix"},{"id":"C","text":"The default configuration creates a directory on the host and mounts it within the Agent. The Agent then creates and listens on a socket file /var/run/datadog/apm.socket. See: https://docs.datadoghq.com/containers/kubernetes/apm/?tab=helm"}],"correctAnswers":["B"],"answerExplanation":""},{"id":28,"question":"What environment variable should you use if you need to send traces to a different socket, host, or port?","type":"single_choice","options":[{"id":"A","text":"DD_TRACE_AGENT_URL"},{"id":"B","text":"DD_TRACE_SOCKET_URL"},{"id":"C","text":"DD_TRACE_HOST_URL"},{"id":"D","text":"DD_TRACE_PORT_URL"}],"correctAnswers":["A"],"answerExplanation":"If a different socket, host, or port is required, use the DD_TRACE_AGENT_URL environment variable. See: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/java/?tab=containers"},{"id":29,"question":"Which port and protocol does the Datadog Agent use to receive APM data?","type":"single_choice","options":[{"id":"A","text":"8126/tcp"},{"id":"B","text":"8125/udp"},{"id":"C","text":"10250/tcp"},{"id":"D","text":"443/tcp"}],"correctAnswers":["A"],"answerExplanation":"8126/tcp is the Port for the APM receiver. See: https://docs.datadoghq.com/agent/guide/network/?tab=agentv6v7"},{"id":30,"question":"How much historical data can the seasonal algorithms of Anomaly Monitors use when calculating an APM metric’s expected","type":"single_choice","options":[{"id":"A","text":"normal range of behavior?"},{"id":"B","text":"A couple of weeks"},{"id":"C","text":"A couple of months"},{"id":"D","text":"A couple of years"},{"id":"E","text":"There is no limit."}],"correctAnswers":["C"],"answerExplanation":"All of the seasonal algorithms may use up to a couple of months of historical data when calculating a metric’s expected normal range of behavior. See: https://docs.datadoghq.com/monitors/types/anomaly/#anomaly-detection-algorithms"},{"id":31,"question":"What is Datadog's recommendation on enabling tracer debug mode?","type":"single_choice","options":[{"id":"A","text":"Always enable debug mode in production systems"},{"id":"B","text":"Use debug mode for debugging purposes only"},{"id":"C","text":"Debug mode is enabled by default"},{"id":"D","text":"Debug mode increases the number of events sent to your loggers"}],"correctAnswers":["B"],"answerExplanation":"Datadog does not recommend that you enable debug mode in production systems because it increases the number of events that are sent to your loggers. Use debug mode for debugging purposes only. See: https://docs.datadoghq.com/tracing/troubleshooting/tracer_debug_logs/?code-lang=python"},{"id":32,"question":"What is the default state of tracer debug mode?","type":"single_choice","options":[{"id":"A","text":"Disabled"},{"id":"B","text":"Enabled"},{"id":"C","text":"Dependent on the language tracer"},{"id":"D","text":"Dependent on the application version"}],"correctAnswers":["A"],"answerExplanation":"Debug mode is disabled by default. See: https://docs.datadoghq.com/tracing/troubleshooting/tracer_debug_logs/?code-lang=python"},{"id":33,"question":"What does the following code do? tracer.configure(settings={'FILTERS':[FilterRequestsOnUrl(r'http://test\\.example\\.com')]})","type":"single_choice","options":[{"id":"A","text":"Filters out all traces of incoming requests to http://test.example.com"},{"id":"B","text":"Matches all traces from the"},{"id":"C","text":"See: https://ddtrace.readthedocs.io/en/stable/advanced_usage.html#trace-filtering"}],"correctAnswers":["A"],"answerExplanation":""},{"id":34,"question":"How can you modify the default tracer object to use another hostname and port?","type":"single_choice","options":[{"id":"A","text":"By calling the tracer object with the new hostname and port"},{"id":"B","text":"By modifying the code of the tracer object"},{"id":"C","text":"By using a Unix ion"},{"id":"D","text":"You can modify the default tracer object by calling tracer.configure() with the new hostname and port. See: https://ddtrace.readthedocs.io/en/stable/advanced_usage.html#agent-configuration"}],"correctAnswers":["A"],"answerExplanation":""},{"id":35,"question":"How do you instrument Python-based serverless applications using the Datadog Lambda Extension?","type":"single_choice","options":[{"id":"A","text":"Use the Datadog CLI"},{"id":"B","text":"Use AWS SAM"},{"id":"C","text":"Use Serverless Framework"},{"id":"D","text":"All choices are supported."}],"correctAnswers":["D"],"answerExplanation":"See: https://docs.datadoghq.com/serverless/installation/python/?tab=datadogcli#installation"},{"id":36,"question":"What is the Datadog Lambda Extension?","type":"single_choice","options":[{"id":"A","text":"A special build of the AWS Lambda"},{"id":"B","text":"An AWS Lambda Extension that supports submitting custom metrics, traces, and logs"},{"id":"C","text":"A tool to configure your AWS Lambda function"},{"id":"D","text":"A repository containing release notes and scripts related to AWS Lambda"}],"correctAnswers":["B"],"answerExplanation":"The Datadog Lambda Extension is an AWS Lambda Extension that supports submitting custom metrics, traces, and logs. See: https://docs.datadoghq.com/serverless/libraries_integrations/extension/"},{"id":37,"question":"Which of the following terms refer to the targeted levels of service typically expressed as a percentage over a period of time?","type":"single_choice","options":[{"id":"A","text":"SLI"},{"id":"B","text":"SLO"},{"id":"C","text":"SLA"},{"id":"D","text":"Error Budget"}],"correctAnswers":["B"],"answerExplanation":"Service Level Objectives (SLOs) are the targeted levels of service, measured by Service Level Indicators (SLIs). SLOs are usually expressed as a percentage over a period of time. See: https://www.datadoghq.com/blog/establishing-service-level-objectives/#key-terminology"},{"id":38,"question":"Which of the following is the correct query if you would like to create an SLO of 99.9% of requests do not encounter an error?","type":"single_choice","options":[{"id":"A","text":"(hits - errors) / hits"},{"id":"B","text":"(hits + errors) / hits"},{"id":"C","text":"(hits + errors) / errors"},{"id":"D","text":"(hits - errors) / errors"}],"correctAnswers":["A"],"answerExplanation":"For the numerator, you need to make a query for the number of requests that did not encounter an error. The trace hits metrics would contain all hits including those that encountered an error. To get the total of those without errors, you need to subtract the errors. For the denominator, you need the total number of requests which are the hits. For more information, see: https://docs.datadoghq.com/monitors/service_level_objectives/metric/"},{"id":39,"question":"Which language requires importing a series of pluggable packages in order to instrument libraries and frameworks?","type":"single_choice","options":[{"id":"A","text":"Go"},{"id":"B","text":"Node.js"},{"id":"C","text":"Python"},{"id":"D","text":".NET Framework"}],"correctAnswers":["A"],"answerExplanation":"For Go, Datadog has a series of pluggable packages which provide out-of-the-box support for instrumenting a series of libraries and frameworks. You need to import these packages into your application and follow the configuration instructions listed alongside each integration. See:"},{"id":40,"question":"What is the default retention for profiles?","type":"single_choice","options":[{"id":"A","text":"7 days"},{"id":"B","text":"15 days"},{"id":"C","text":"1 month"},{"id":"D","text":"15 months"}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/developers/guide/data-collection-resolution-retention/"},{"id":41,"question":"When doing deployment comparison with Deployment Tracking, how far back can you compare two versions?","type":"single_choice","options":[{"id":"A","text":"7 days"},{"id":"B","text":"15 days"},{"id":"C","text":"30 days"},{"id":"D","text":"15 months"}],"correctAnswers":["C"],"answerExplanation":"You can compare any two versions within the past 30 days. See: https://docs.datadoghq.com/tracing/services/deployment_tracking/#deployment-comparison"},{"id":42,"question":"What is the default value of the environment variable DD_ENV when instrumenting the Java tracer?","type":"single_choice","options":[{"id":"A","text":"none"},{"id":"B","text":"unnamed-java-app"},{"id":"C","text":"true"},{"id":"D","text":"false"}],"correctAnswers":["A"],"answerExplanation":"The default value of the environment variable DD_ENV is \"none\". This variable is used to define the application environment such as production, staging, etc. See: https://docs.datadoghq.com/tracing/trace_collection/library_config/java"},{"id":43,"question":"You would like to collect node labels so that you can set them as the second primary tags. Where should you set DD_KUBERNETES_NODE_LABELS_AS_TAGS?","type":"single_choice","options":[{"id":"A","text":"On the Datadog Agent"},{"id":"B","text":"On the target application"},{"id":"C","text":"On the Datadog app"},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["A"],"answerExplanation":"To extract a given node label and transform it as a tag key within Datadog, you need to add DD_KUBERNETES_NODE_LABELS_AS_TAGS to the Datadog Agent. See: https://docs.datadoghq.com/containers/kubernetes/tag/?tab=containerizedagent#node-labels-as- tags"},{"id":44,"question":"Which reserved tags do you use for Unified Service Tagging?","type":"single_choice","options":[{"id":"A","text":"env, service, version"},{"id":"B","text":"env, source, version"},{"id":"C","text":"host, service, version"},{"id":"D","text":"device, host, source"},{"id":"E","text":"device, host, service"}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/"},{"id":45,"question":"You made a trace metric query and noticed that when grouping by the version tag, there's a group showing up as N/A. Other groups show the version of your app as expected. What could be a possible cause for this?","type":"single_choice","options":[{"id":"A","text":"DD_VERSION is not set on some hosts."},{"id":"B","text":"DD_VERSION is not set for all instances of the app."},{"id":"C","text":"Tracing is turned off on the app level."},{"id":"D","text":"APM is turned off on the Datadog Agent."}],"correctAnswers":["A"],"answerExplanation":"DD_VERSION is not set on some hosts because only a fraction of the trace metrics are affected. If DD_VERSION is not set for all instances of the app, then there will be only the N/A group. If APM is turned off either on the Datadog Agent or the app, then there would be no trace metrics at all. More info on Unified Service Tagging here: https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/"},{"id":46,"question":"How do you set Unified Service Tagging for the APM tracer when running applications in Kubernetes?","type":"single_choice","options":[{"id":"A","text":"Set them as environment variables."},{"id":"B","text":"Set them as tracer configs."},{"id":"C","text":"Set them as application profiles."},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["A"],"answerExplanation":"You can use the Kubernetes’s downward API to configure APM tracer environment variables. See: https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/?tab=kubernetes"},{"id":47,"question":"What approach can you take if there's no Datadog support for your particular technology?","type":"single_choice","options":[{"id":"A","text":"Use OpenTracing / OpenTelemetry"},{"id":"B","text":"Use Community libraries"},{"id":"C","text":"Use Datadog Tracing API"},{"id":"D","text":"All of the choices are viable options."}],"correctAnswers":["D"],"answerExplanation":"For OpenTracing, see: https://docs.datadoghq.com/tracing/trace_collection/opentracing/ For OpenTelemetry, see: https://docs.datadoghq.com/tracing/trace_collection/otel_instrumentation/ For community libraries, see: https://docs.datadoghq.com/developers/community/libraries/#apm-- continuous-profiler-client-libraries For the tracing API, see: https://docs.datadoghq.com/tracing/guide/send_traces_to_agent_by_api/"},{"id":48,"question":"Given the span summary, which column should you check to determine where the trace is spending the most time on?","type":"single_choice","options":[{"id":"A","text":"AVG % EXEC TIME"},{"id":"B","text":"AVG DURATION"},{"id":"C","text":"ERROR RATE"},{"id":"D","text":"SERVICE NAME"}],"correctAnswers":["A"],"answerExplanation":"The average execution time represents where the trace spends the most time on."},{"id":49,"question":"Which language does not provide automatic instrumentation?","type":"single_choice","options":[{"id":"A","text":"Java"},{"id":"B","text":"Python"},{"id":"C","text":"PHP"},{"id":"D","text":"C++"}],"correctAnswers":["D"],"answerExplanation":"Automatic instrumentation refers to tracer integrations for OOTB instrumentation. C++ does not provide integrations for OOTB instrumentation, but it’s used by Proxy tracing such as Envoy and Nginx. See: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/cpp/"},{"id":50,"question":"Which of the following information can be part of startup logs?","type":"single_choice","options":[{"id":"A","text":"A. Datadog tracer configuration"},{"id":"B","text":"B. Datadog tracer diagnostics"},{"id":"C","text":"C. Datadog configuration"},{"id":"D","text":"D. All of the above"}],"correctAnswers":["D"],"answerExplanation":"Tracer startup logs capture all obtainable information at startup and log it as Datadog tracer configuration, diagnostics, or configuration. See: https://docs.datadoghq.com/tracing/troubleshooting/tracer_startup_logs?code-lang=java"},{"id":51,"question":"What are services in a microservice architecture?","type":"single_choice","options":[{"id":"A","text":"The building blocks of an application"},{"id":"B","text":"A particular method for a request to a service"}],"correctAnswers":["A"],"answerExplanation":"Services are the building blocks of modern microservice architectures - broadly a service groups together endpoints, queries, or jobs for the purposes of building your application. See: https://docs.datadoghq.com/tracing/glossary/#services"},{"id":52,"question":"What is the purpose of Resources in Datadog APM?","type":"single_choice","options":[{"id":"A","text":"To group together endpoints, queries, or jobs"},{"id":"B","text":"To track the time spent by an application processing a request"},{"id":"C","text":"To show an aggregate view of spans for all traces"},{"id":"D","text":"To represent a particular icular g/glossary/#resources"}],"correctAnswers":["D"],"answerExplanation":""},{"id":53,"question":"What is a span in APM?","type":"single_choice","options":[{"id":"A","text":"A particular t of work in a distributed system for a given time period"},{"id":"B","text":"A tool to troubleshoot application performance"},{"id":"C","text":"A building block of modern microservice architectures"}],"correctAnswers":["A"],"answerExplanation":""},{"id":54,"question":"When monitoring applications in a containerized environment, where are the tracer debug logs usually located?","type":"single_choice","options":[{"id":"A","text":"In the Datadog Agent container"},{"id":"B","text":"In the application container"},{"id":"C","text":"Both Agent and app containers."}],"correctAnswers":["B"],"answerExplanation":"The tracer debug logs would be with the application, not the Agent. These logs are not sent to the Datadog Agent in the flare and are stored in a separate path depending on your logging configuration. See: https://docs.datadoghq.com/tracing/troubleshooting/tracer_debug_logs/"},{"id":55,"question":"What information do tracer debug logs contain?","type":"single_choice","options":[{"id":"A","text":"Whether or not traces were sent to the Datadog Agent"},{"id":"B","text":"Whether or not the application has high load"},{"id":"C","text":"Whether or not the Datadog Agent has high load"},{"id":"D","text":"All the choices are included in tracer debug logs."}],"correctAnswers":["A"],"answerExplanation":"The tracer debug logs contain information for diagnosing tracer issues or audit trace data. It does not include information about the load on the Datadog Agent nor the application being monitored. The best answer is whether or not traces were sent to the Datadog Agent. See: https://docs.datadoghq.com/tracing/troubleshooting/tracer_debug_logs/"},{"id":56,"question":"What is the benefit of using Watchdog AI in Datadog's APM and observability platform?","type":"single_choice","options":[{"id":"A","text":"To improve code performance in any environment, including production"},{"id":"B","text":"To provide high-granularity data and custom metrics in real time"},{"id":"C","text":"To suggest root cause analyses for unanticipated outliers"},{"id":"D","text":"To improve on key metrics to prevent outages and errors"}],"correctAnswers":["C"],"answerExplanation":"Watchdog AI has features to automatically detect unanticipated outliers and resolve incidents faster with instant root cause analyses. See: https://www.datadoghq.com/dg/apm/benefits-os-b/"},{"id":57,"question":"How long are traces retained?","type":"single_choice","options":[{"id":"A","text":"7 days"},{"id":"B","text":"15 days"},{"id":"C","text":"1 month"},{"id":"D","text":"Depends on the contract plan"}],"correctAnswers":["D"],"answerExplanation":"Trace retention corresponds to indexed spans. The default retention for indexed spans depends on the plan agreed upon in your Datadog contract. See: https://docs.datadoghq.com/developers/guide/data-collection-resolution-retention/"},{"id":58,"question":"Given the span summary, which column should you check to determine which resource had the most errors encountered?","type":"single_choice","options":[{"id":"A","text":"AVG % EXEC TIME"},{"id":"B","text":"AVG DURATION"},{"id":"C","text":"ERROR RATE"},{"id":"D","text":"SERVICE NAME"}],"correctAnswers":["D"],"answerExplanation":"The error rate will tell you which part of the trace encounters a lot of errors."},{"id":59,"question":"Which view is best for checking sets of errors over time to know when they first started, if they are still ongoing, and how often they are occurring?","type":"single_choice","options":[{"id":"A","text":"Error Tracking"},{"id":"B","text":"Service Page"},{"id":"C","text":"Trace Explorer"},{"id":"D","text":"Service List"}],"correctAnswers":["A"],"answerExplanation":"Error Tracking enables you to group errors into issues, and follow issues over time to know when they first started, if they are still ongoing, and how often they are occurring. See: https://docs.datadoghq.com/tracing/error_tracking/"},{"id":60,"question":"What is error tracking for APM useful for?","type":"single_choice","options":[{"id":"A","text":"Setting alerts on fatal issues that may occur."},{"id":"B","text":"Grouping similar errors into issues to reduce noise."},{"id":"C","text":"Following issues over time."},{"id":"D","text":"All are correct."}],"correctAnswers":["D"],"answerExplanation":"Error Tracking enables you to set alerts to remain informed of fatal issues that may occur, group similar errors into issues to easily identify important errors and reduce noise, and follow issues over time to know when they first started, if they are still ongoing, and how often they are occurring. See: https://docs.datadoghq.com/tracing/error_tracking/"},{"id":61,"question":"The trace view indicates that the rack.request span is taking 7.53 seconds to execute with an indicator of p94. What can we conclude from this information?","type":"single_choice","options":[{"id":"A","text":"This span's duration is slower than average."},{"id":"B","text":"This span's duration is faster than average."},{"id":"C","text":"This span's duration is around the general average."}],"correctAnswers":["A"],"answerExplanation":"p94 means that assuming 100 spans, this span would be the 94th largest. More information on Trace View here: https://docs.datadoghq.com/tracing/trace_explorer/trace_view/?tab=spantags"},{"id":62,"question":"To find the slowest endpoint of a web service, you need to navigate to the service page and arrange the resources by which column?","type":"single_choice","options":[{"id":"A","text":"requests"},{"id":"B","text":"total time"},{"id":"C","text":"p99 latency"},{"id":"D","text":"error rate"}],"correctAnswers":["C"],"answerExplanation":"Slowness of an endpoint would correspond to latency. More information here: https://docs.datadoghq.com/tracing/services/service_page/#resources"},{"id":63,"question":"Which service would have the highest request duration for a single request?","type":"single_choice","options":[{"id":"A","text":"The one with the highest p100 latency."},{"id":"B","text":"The one with the highest p99 latency."},{"id":"C","text":"The one with the highest error rate."},{"id":"D","text":"The one with the highest requests."}],"correctAnswers":["A"],"answerExplanation":"p100 latency or the 100th percentile latency is the largest value in the ordered list of latencies observed. More information on Service Catalog here: https://docs.datadoghq.com/tracing/service_catalog/#performance-view"},{"id":64,"question":"How do you monitor shadow deployments with APM?","type":"single_choice","options":[{"id":"A","text":"Tag shadows with a version tag to compare error rates between the two versions to determine if the shadow version should be released."},{"id":"B","text":"Tag shadows with a shadow: true tag to aggregate latencies across all shadows to determine if the production version should be deprecated."},{"id":"C","text":"Tag shadows with a source tag to compare service behavior between the two sources to determine if the infrastructure configuration should be released."}],"correctAnswers":["A"],"answerExplanation":"Shadow deployment is when a release candidate version is deployed alongside the production version. Incoming traffic is sent to both. Shadow deploys test a potential release against real production traffic. Tagging shadows with a version tag lets you compare error rates, traces, and service behavior between the two versions to determine if the shadow version should be released. See: https://docs.datadoghq.com/tracing/services/deployment_tracking/#shadow-deploys"},{"id":65,"question":"Deployment tracking is useful for monitoring which deployment strategy?","type":"single_choice","options":[{"id":"A","text":"Rolling deploys"},{"id":"B","text":"Blue and green deploys"},{"id":"C","text":"Canary deploys"},{"id":"D","text":"Rolling and canary deploys"},{"id":"E","text":"All of the choices are correct."}],"correctAnswers":["E"],"answerExplanation":"Deployment tracking supports all the mentioned deployment strategies. For more information, see: https://docs.datadoghq.com/tracing/services/deployment_tracking/#deployment-strategies"},{"id":66,"question":"Which of the following is not a scenario to use Profiles comparison in Datadog?","type":"single_choice","options":[{"id":"A","text":"Comparing two latest deployments."},{"id":"B","text":"Comparing two different time periods."},{"id":"C","text":"Comparing two different sets of tags."},{"id":"D","text":"Comparing two different code languages."}],"correctAnswers":["D"],"answerExplanation":"See: https://docs.datadoghq.com/profiler/compare_profiles"},{"id":67,"question":"Which tab on the trace panel shows the time taken waiting for a lock of a synchronized object?","type":"single_choice","options":[{"id":"A","text":"Infrastructure"},{"id":"B","text":"Network"},{"id":"C","text":"Processes"},{"id":"D","text":"Code Hotspots"}],"correctAnswers":["D"],"answerExplanation":"Depending on the runtime and language, the code hotspots tab may contain synchronization information which shows the time taken waiting for a lock of a synchronized object. See: https://docs.datadoghq.com/profiler/connect_traces_and_profiles/"},{"id":68,"question":"What is the default retention from metrics generated from APM spans?","type":"single_choice","options":[{"id":"A","text":"7 days"},{"id":"B","text":"15 days"},{"id":"C","text":"1 month"},{"id":"D","text":"15 months"}],"correctAnswers":["D"],"answerExplanation":"Metrics from spans are treated as custom metrics which by default have a retention of 15 months. See: https://docs.datadoghq.com/tracing/trace_pipeline/generate_metrics/"},{"id":69,"question":"Where are the tracer debug logs located by default for a .NET app running on Windows?","type":"single_choice","options":[{"id":"A","text":"%ProgramData%\\Datadog .NET Tracer\\logs\\"},{"id":"B","text":"%ProgramData%\\Datadog\\logs\\"},{"id":"C","text":"/var/log/datadog/dotnet/"},{"id":"D","text":"%AzureAppServiceHomeDirectory%\\LogFiles\\datadog"}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/troubleshooting/tracer_debug_logs/?code-lang=dotnet"},{"id":70,"question":"Which one is the correct use of the Datadog Java Agent for instrumenting Java applications?","type":"single_choice","options":[{"id":"A","text":"java -javaagent:<DD-JAVA-AGENT-PATH>.jar -jar <YOUR_APPLICATION_PATH>.jar"},{"id":"B","text":"java <YOUR_APPLICATION_PATH>.jar -javaagent:<DD-JAVA-AGENT-PATH>.jar -jar <YOUR_APPLICATION_PATH>.jar"},{"id":"C","text":"java <YOUR_APPLICATION_PATH>.jar -jar -javaagent:<DD-JAVA-AGENT-PATH>.jar"},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["A"],"answerExplanation":"The Datadog Java Agent should come before the application you are instrumenting. See: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/java/"},{"id":71,"question":"For Java applications, how do you set errors on a span when it's not handled by default?","type":"single_choice","options":[{"id":"A","text":"Set the error tag to true on the span."},{"id":"B","text":"Set the tag on the apm_config of the Datadog Agent."},{"id":"C","text":"Create a new span of type error."},{"id":"D","text":"This is not supported."}],"correctAnswers":["A"],"answerExplanation":"To customize an error associated with one of your spans, set the error tag on the span. See: https://docs.datadoghq.com/tracing/trace_collection/custom_instrumentation/java#set-errors-on-a- span"},{"id":72,"question":"On the trace explorer page, what's the difference between Live 15 Minutes and Past 15 Minutes options?","type":"single_choice","options":[{"id":"A","text":"Live 15 Minutes shows ingested spans, Past 15 Minutes shows indexed spans."},{"id":"B","text":"Live 15 Minutes shows indexed spans, Past 15 Minutes shows ingested spans."},{"id":"C","text":"Live 15 Minutes only shows retained spans."},{"id":"D","text":"Past 15 Minutes can miss the last 5 minutes of data."}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/trace_explorer/?tab=listview#live-search-for-15-minutes"},{"id":73,"question":"On the trace explorer list view, you can see spans being listed. However, switching to the timeseries view does not show you the graphs you need. What's the prerequisite for graphing spans and doing trace analytics?","type":"single_choice","options":[{"id":"A","text":"Configure custom retention filters."},{"id":"B","text":"Configure intelligent retention filters."},{"id":"C","text":"Configure spans to metrics."},{"id":"D","text":"Configure custom tagging."}],"correctAnswers":["A"],"answerExplanation":"All spans indexed by custom retention filters (not the intelligent retention filter) are available to be searched when using trace analytics. See: https://docs.datadoghq.com/tracing/trace_explorer/?tab=timeseriesview#indexed-spans-search- with-15-da y-retention"},{"id":74,"question":"APM spans get indexed through which of the following?","type":"single_choice","options":[{"id":"A","text":"Datadog Intelligent Retention Filter"},{"id":"B","text":"Custom Retention Filter"},{"id":"C","text":"Datadog Intelligent Retention Filter and Custom Retention Filter"},{"id":"D","text":"None of the choices."}],"correctAnswers":["C"],"answerExplanation":"The Datadog Intelligent Retention Filter indexes a proportion of traces. You can also define your own custom retention filters to index traces you need for troubleshooting or other purposes. See: https://docs.datadoghq.com/tracing/trace_pipeline/#trace-retention"},{"id":75,"question":"What does the following query do? env:prod @http.status_code:200 -resource_name:\"GET /healthcheck\"","type":"single_choice","options":[{"id":"A","text":"Returns traces with 200 responses for the production environment except for the /healthcheck endpoint."},{"id":"B","text":"Returns traces with 200 responses for the production environment for all endpoints."},{"id":"C","text":"Returns traces that either have the tag env:prod, attribute http.status_code:200, or not having the tag resource_name:\"GET /healthcheck\"."},{"id":"D","text":"Nothing because this query has incorrect syntax."}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/trace_explorer/query_syntax/"},{"id":76,"question":"What does the following query do? env:dev (@http.method:POST OR @http.method:GET)","type":"single_choice","options":[{"id":"A","text":"Returns all traces that are tagged env:dev and has the http.method attribute of either POST or GET."},{"id":"B","text":"Returns all traces that are tagged env:dev or has the http.method attribute of either POST or GET."},{"id":"C","text":"Returns all traces that are not tagged with env:dev and has the http.method attribute of either POST or GET."},{"id":"D","text":"Returns all traces that are tagged env:dev and has the http.method attributes POST and GET."}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/trace_explorer/query_syntax/"},{"id":77,"question":"Which of the following actions require creating facets first?","type":"single_choice","options":[{"id":"A","text":"Searching spans"},{"id":"B","text":"Generating metrics from spans"},{"id":"C","text":"Indexing spans with retention filters"},{"id":"D","text":"None of the choices"}],"correctAnswers":["D"],"answerExplanation":"Creating facets is not required for searching spans, generating metrics from spans, or indexing spans with retention filters. See: https://docs.datadoghq.com/tracing/trace_explorer/facets/"},{"id":78,"question":"How do you use a custom span tag for searching spans?","type":"single_choice","options":[{"id":"A","text":"You must create a facet for the custom span tag first."},{"id":"B","text":"You can type in @ followed by the custom span tag in the search bar directly."},{"id":"C","text":"The UI only supports search for default span tags."}],"correctAnswers":["B"],"answerExplanation":"You can type in @ followed by the custom span tag in the search bar directly. See syntax: https://docs.datadoghq.com/tracing/trace_explorer/query_syntax/#facet-search Creating facets is not required for searching spans. See: https://docs.datadoghq.com/tracing/trace_explorer/facets/"},{"id":79,"question":"How do you query for web services in the Service Catalog?","type":"single_choice","options":[{"id":"A","text":"source:web"},{"id":"B","text":"type:web"},{"id":"C","text":"version:web"},{"id":"D","text":"infra_type:web"}],"correctAnswers":["B"],"answerExplanation":"The service catalog has a faceting for Type. Clicking on the type web will add a query type:web. You can confirm this on the Datadog UI. More information: https://docs.datadoghq.com/tracing/services/services_list/#services-types"},{"id":80,"question":"How do you query for services with Watchdog stories on the Service Catalog?","type":"single_choice","options":[{"id":"A","text":"watchdog:false"},{"id":"B","text":"watchdog:true"},{"id":"C","text":"anomaly:true"},{"id":"D","text":"anomaly:false"}],"correctAnswers":["B"],"answerExplanation":"The service catalog has a facet \"Has Watchdog alerts\". Clicking on this facet will add a query watchdog:true. You can confirm this on the Datadog UI. More information: https://docs.datadoghq.com/watchdog/#watchdog-in-the-services-list"},{"id":81,"question":"How do you set up deployment tracking?","type":"single_choice","options":[{"id":"A","text":"Set up the unified service tagging."},{"id":"B","text":"Set DD_DEPLOYMENT_TRACKING to true."},{"id":"C","text":"Set DD_ERROR_TRACKING to true."},{"id":"D","text":"Set the deployment tag."}],"correctAnswers":["A"],"answerExplanation":"Unified service tagging involves setting env, service and version. Deployment tracking requires the version tag to set so setting up unified service tagging is enough. See: https://docs.datadoghq.com/tracing/services/deployment_tracking/"},{"id":82,"question":"The profiler can be run in which of the following environments?","type":"single_choice","options":[{"id":"A","text":"Development environments only."},{"id":"B","text":"Testing environments only."},{"id":"C","text":"Both development and testing environments, but not production."},{"id":"D","text":"You can run the profiler in development, testing, and production environments."}],"correctAnswers":["D"],"answerExplanation":"The continuous profiler can be run in production because it's designed for continuous monitoring with minimal impact on host CPU and memory usage. See: https://docs.datadoghq.com/profiler/#low-impact-in-production"},{"id":83,"question":"How do you turn on the Datadog Continuous Profiler?","type":"single_choice","options":[{"id":"A","text":"Set DD_PROFILING_ENABLED to true on the tracer."},{"id":"B","text":"It's already enabled when using a tracing library by default."},{"id":"C","text":"Run language-specific startup commands for the profiling library."}],"correctAnswers":["A"],"answerExplanation":"For Java, enable the profiler by setting the -Ddd.profiling.enabled flag or DD_PROFILING_ENABLED environment variable to true. Other languages also support DD_PROFILING_ENABLED. See: https://docs.datadoghq.com/profiler/enabling/java?tab=datadog"},{"id":84,"question":"What additional steps do you need to take to ensure RUM to APM correlation?","type":"single_choice","options":[{"id":"A","text":"Allow passing Datadog headers to your backend applications."},{"id":"B","text":"Update the clientToken to an APM enabled token."},{"id":"C","text":"Set a traceRetentionRate to retain traces connected to RUM."}],"correctAnswers":["A"],"answerExplanation":"These HTTP headers are not CORS-safelisted, so you need to configure Access-Control-Allow-Headers on your server handling requests that the SDK is set up to monitor. The server must also accept preflight requests (OPTIONS requests), which are made by the SDK prior to every request. See: https://docs.datadoghq.com/real_user_monitoring/connect_rum_and_traces/?tab=browserrum#how-are- ru m-resources-linked-to-traces"},{"id":85,"question":"To connect RUM and traces, you need to set allowed Tracing Urls in which component?","type":"single_choice","options":[{"id":"A","text":"Datadog Agent"},{"id":"B","text":"Datadog RUM SDK"},{"id":"C","text":"Datadog Tracing Library"},{"id":"D","text":"Application Gateway"}],"correctAnswers":["B"],"answerExplanation":"See: https://docs.datadoghq.com/real_user_monitoring/connect_rum_and_traces/?tab=browserrum"},{"id":86,"question":"The logs section in the trace panel is empty. What could be a possible reason for this?","type":"single_choice","options":[{"id":"A","text":"Logs are not collected from the host, container, or pod that emitted the trace."},{"id":"B","text":"There were no logs for that host within the trace’s timeframe."},{"id":"C","text":"The logs’ timestamp was not properly set."},{"id":"D","text":"All of the choices are correct."}],"correctAnswers":["D"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/troubleshooting/correlated-logs-not-showing-up-in-the-trace-id- panel/?tab=custom#infrastructure-options"},{"id":87,"question":"How do you connect logs to traces?","type":"single_choice","options":[{"id":"A","text":"Set DD_LOGS_INJECTION to true."},{"id":"B","text":"Set DD_TRACE_DEBUG_LOGS to true."},{"id":"C","text":"Add log ID as span tags."},{"id":"D","text":"Set the span tag error to true."}],"correctAnswers":["A"],"answerExplanation":"Setting DD_LOGS_INJECTION to true configures the tracer to automatically inject trace correlation identifiers into logs. See: https://docs.datadoghq.com/tracing/other_telemetry/connect_logs_and_traces/java/?tab=log4j2#automat ic-injection"},{"id":88,"question":"How can you exclude specific resources from being collected?","type":"single_choice","options":[{"id":"A","text":"Use the ignore_resources setting in the datadog.yaml file"},{"id":"B","text":"Update the DD_APM_REPLACE_TAGS environment variable"},{"id":"C","text":"Set the DD_HTTP_SERVER_TAG_QUERY_STRING environment variable to false"},{"id":"D","text":"None of the above"}],"correctAnswers":["A"],"answerExplanation":"To exclude specific resources from being traced, you can use the ignore_resources setting in the datadog.yaml file and create a list of regular expressions specifying the resources to be filtered out. See: https://docs.datadoghq.com/tracing/configure_data_security/"},{"id":89,"question":"Datadog enforces several filtering mechanisms on spans as a baseline, to provide sound defaults for basic security and generalize resource names to facilitate grouping during analysis. For SQL queries, what is obfuscated even when not using prepared statements?","type":"single_choice","options":[{"id":"A","text":"Variables"},{"id":"B","text":"Operations"},{"id":"C","text":"Conditions"},{"id":"D","text":"None of the choices."}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/configure_data_security/"},{"id":90,"question":"Which statement is true for trace metrics?","type":"single_choice","options":[{"id":"A","text":"Trace metrics are calculated based on indexed traces."},{"id":"B","text":"Trace metrics are kept with a 15-month retention policy by default."},{"id":"C","text":"Trace metrics are impacted by trace ingestion controls."},{"id":"D","text":"All of the choices are correct."}],"correctAnswers":["B"],"answerExplanation":"Trace metrics are automatically collected and kept with a 15-month retention policy similar to other Datadog metrics. They can be used to identify and alert on hits, errors, or latency. Statistics and metrics are always calculated based on all traces, and are not impacted by ingestion controls. See: https://docs.datadoghq.com/tracing/glossary/#trace-metrics"},{"id":91,"question":"How do you send the traces to a different hostname and port?","type":"single_choice","options":[{"id":"A","text":"Set the hostname and port via DD_TRACE_AGENT_URL"},{"id":"B","text":"Set the hostname and port via DD_TRACE_SOCKET_URL"},{"id":"C","text":"Set the hostname and port via DD_TRACE_HOST_URL"},{"id":"D","text":"Set the hostname and port via DD_TRACE_PORT_URL"}],"correctAnswers":["A"],"answerExplanation":"If a different socket, host, or port is required, use the DD_TRACE_AGENT_URL environment variable. See: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/java/?tab=containers"},{"id":92,"question":"Which of the following are typically an instrumented web endpoint, database query, or background job representing a","type":"single_choice","options":[{"id":"A","text":"particular"},{"id":"B","text":"spans"},{"id":"C","text":"resources"},{"id":"D","text":"traces"}],"correctAnswers":["C"],"answerExplanation":"Resources represent a particular g/glossary/#resources"},{"id":93,"question":"What are retention filters in Datadog APM?","type":"single_choice","options":[{"id":"A","text":"Controls used to send up to 100% of traces to Datadog for live search and analytics"},{"id":"B","text":"Automatically collected metrics with a 15-month retention policy"},{"id":"C","text":"Controls set within the Datadog UI that determine what spans to index in Datadog"},{"id":"D","text":"The execution duration of a given type / service within a trace"}],"correctAnswers":["C"],"answerExplanation":"Retention filters are tag-based controls set within the Datadog UI that determine what spans to index in Datadog. See: https://docs.datadoghq.com/tracing/glossary/#retention-filters"},{"id":94,"question":"How can you disable startup logs?","type":"single_choice","options":[{"id":"A","text":"By setting the environment variable DD_TRACE_STARTUP_LOGS to false"},{"id":"B","text":"By deleting the logs file"},{"id":"C","text":"By changing the log level to ERROR"},{"id":"D","text":"By restarting the tracer"}],"correctAnswers":["A"],"answerExplanation":"You can disable startup logs by setting the environment variable DD_TRACE_STARTUP_LOGS=false. See: https://docs.datadoghq.com/tracing/troubleshooting/tracer_startup_logs?code-lang=java"},{"id":95,"question":"Which filtering and generalization mechanism does Datadog apply on spans to provide sound defaults for basic security?","type":"single_choice","options":[{"id":"A","text":"Environment variables are not collected."},{"id":"B","text":"SQL variables are obfuscated."},{"id":"C","text":"Numbers in resource names like URLs are obfuscated."},{"id":"D","text":"All of the choices are correct."}],"correctAnswers":["D"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/configure_data_security/?tab=mongodb#generalizing-resource- names -and-filtering-baseline"},{"id":96,"question":"How do you stop unwanted or sensitive resources from being monitored by APM?","type":"single_choice","options":[{"id":"A","text":"Set Agent configurations"},{"id":"B","text":"Set tracing library configurations"},{"id":"C","text":"Set either Agent or tracing library configurations."},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["C"],"answerExplanation":"This can be handled either on the Agent level or tracer level via additional configurations. See: https://docs.datadoghq.com/tracing/guide/ignoring_apm_resources/?tab=datadogyaml#ignoring- based-on -resources"},{"id":97,"question":"How do you connect RUM and traces for browser based applications?","type":"single_choice","options":[{"id":"A","text":"Set service and allowedTracingUrls on the Datadog Agent"},{"id":"B","text":"Set service and allowedTracingUrls on the Datadog RUM SDK"},{"id":"C","text":"Set service and allowedTracingUrls on the Datadog Tracing Library"}],"correctAnswers":["B"],"answerExplanation":"See: https://docs.datadoghq.com/real_user_monitoring/connect_rum_and_traces/?tab=browserrum"},{"id":98,"question":"What does the following code snippet do for RUM React Native Monitoring? config.firstPartyHosts = [\"example.com\",","type":"single_choice","options":[{"id":"A","text":"\"api.yourtadog headers when making requests to api.yournecting Datadog RUM and APM. The way it works is that the RUM SDK will add Datadog headers to requests to your first party backend services. See: https://docs.datadoghq.com/real_user_monitoring/connect_rum_and_traces/?tab=reactnativerum#how-a re-rum-resources-linked-to-traces"}],"correctAnswers":["A"],"answerExplanation":""},{"id":99,"question":"How do you connect Datadog RUM and APM for Android applications?","type":"single_choice","options":[{"id":"A","text":"Configure the OkHttpClient interceptor with the list of internal, first-party origins."},{"id":"B","text":"Configure the OkHttpClient interceptor with the list of external, third-party destinations."},{"id":"C","text":"This is not supported."},{"id":"D","text":"This is enabled by default."}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/real_user_monitoring/connect_rum_and_traces/?tab=androidrum#setup- rum"},{"id":100,"question":"What is the default port used by the Datadog Agent to listen for trace data?","type":"single_choice","options":[{"id":"A","text":"8125"},{"id":"B","text":"8126"},{"id":"C","text":"10250"},{"id":"D","text":"443"}],"correctAnswers":["B"],"answerExplanation":"By default, the Datadog Agent is enabled in your datadog.yaml file under apm_config with enabled: true and listens for trace data at http://localhost:8126. See: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/java/?tab=containers#configure- the-datadog-agent-for-apm"},{"id":101,"question":"The following are benefits of using Datadog's APM and Distributed tracing except?","type":"single_choice","options":[{"id":"A","text":"Identify performance bottlenecks in applications"},{"id":"B","text":"Visualize default and custom metrics from services"},{"id":"C","text":"Compare code performance changes"},{"id":"D","text":"Extract patterns from logs"}],"correctAnswers":["D"],"answerExplanation":"Extracting patterns from logs is a feature of Datadog Log Management. The rest are use cases for APM and distributed tracing. See: https://www.datadoghq.com/dg/apm/benefits-os-b/"},{"id":102,"question":"After the application is instrumented, the trace client will attempt to send traces to the Unix","type":"single_choice","options":[{"id":"A","text":"Traces are directed to http://localhost:8126."},{"id":"B","text":"The tracer will fail safely with an error on debug logs."},{"id":"C","text":"The tracer will look for the custom URL set."},{"id":"D","text":"The application will restart."}],"correctAnswers":["C"],"answerExplanation":""},{"id":103,"question":"Which parameter should you set to true in the datadog.yaml configuration file if you want to receive traces from another host or container?","type":"single_choice","options":[{"id":"A","text":"apm_non_local_traffic"},{"id":"B","text":"dd_trace_agent_url"},{"id":"C","text":"apm_dd_url"},{"id":"D","text":"max_traces_per_second"}],"correctAnswers":["A"],"answerExplanation":"You should set apm_non_local_traffic: true in the apm_config section of your main datadog.yaml configuration file to enable trace collection for non-local traffic. See: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/java/?tab=containers#configure- the-data dog-agent-for-apm For more information, you can check the notes on the datadog.yaml template: https://github.com/DataDog/datadog-agent/blob/main/pkg/config/config_template.yaml"},{"id":104,"question":"Where are the tracer debug logs located by default for a .NET app running on Linux?","type":"single_choice","options":[{"id":"A","text":"%ProgramData%\\Datadog .NET Tracer\\logs\\"},{"id":"B","text":"%ProgramData%\\Datadog\\logs\\"},{"id":"C","text":"/var/log/datadog/dotnet/"},{"id":"D","text":"%AzureAppServiceHomeDirectory%\\LogFiles\\datadog"}],"correctAnswers":["C"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/troubleshooting/tracer_debug_logs/?code-lang=dotnet"},{"id":105,"question":"Which of the following is the correct way to instrument your Java application with logs injection enabled?","type":"single_choice","options":[{"id":"A","text":"java -javaagent:/path/to/dd-java-agent.jar -Ddd.logs.injection=true -jar path/to/your/app.jar"},{"id":"B","text":"java -jar path/to/your/app.jar -javaagent:/path/to/dd-java-agent.jar -Ddd.logs.injection=true"},{"id":"C","text":"java -jar path/to/your/app.jar -Ddd.logs.injection=true -javaagent:/path/to/dd-java-agent.jar"},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["A"],"answerExplanation":"The Datadog Java Agent should come before the application you are instrumenting followed by additional configurations like enabling log collection. See: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/java/?tab=containers#instrument- your-application"},{"id":106,"question":"How do you manually flag a span as erroneous when instrumenting Ruby applications?","type":"single_choice","options":[{"id":"A","text":"Call span.set_error and pass in the Exception Object."},{"id":"B","text":"Set the tag on the apm_config of the Datadog Agent via regex."},{"id":"C","text":"Use the Datadog::Tracing.trace method."},{"id":"D","text":"This is not supported."}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/trace_collection/custom_instrumentation/ruby?tab=manuallyinstrume ntedspans#setting-errors-on-a-span"},{"id":107,"question":"Which environment variable can be used to dynamically rename services via configuration?","type":"single_choice","options":[{"id":"A","text":"DD_WRITER_TYPE"},{"id":"B","text":"DD_SERVICE_MAPPING"},{"id":"C","text":"DD_TRACE_CONFIG"},{"id":"D","text":"DD_TRACE_DB_CLIENT_SPLIT_BY_INSTANCE"}],"correctAnswers":["B"],"answerExplanation":"The environment variable DD_SERVICE_MAPPING can be used to dynamically rename services via configuration. This can be useful for making databases have distinct names across different services. See: https://docs.datadoghq.com/tracing/trace_collection/library_config/java"},{"id":108,"question":"What is the purpose of enabling tracer debug mode?","type":"single_choice","options":[{"id":"A","text":"To diagnose issues or audit trace data"},{"id":"B","text":"To increase the number of events sent to your loggers"},{"id":"C","text":"To reduce the number of events sent to your loggers"},{"id":"D","text":"To use Datadog debug settings in production systems"}],"correctAnswers":["A"],"answerExplanation":"Enabling debug mode in Datadog helps to diagnose issues or audit trace data. See: https://docs.datadoghq.com/tracing/troubleshooting/tracer_debug_logs/?code-lang=python"},{"id":109,"question":"Distributed traces can seamlessly correlate to which of the following data?","type":"single_choice","options":[{"id":"A","text":"profiles"},{"id":"B","text":"logs"},{"id":"C","text":"network"},{"id":"D","text":"All of the choices are correct."},{"id":"E","text":"infrastructure metrics"}],"correctAnswers":["D"],"answerExplanation":"Distributed traces are linked to browser sessions, logs, profiles, synthetic checks, network, processes, and infrastructure metrics across hosts, containers, proxies, and serverless functions in the Datadog UI. See: https://docs.datadoghq.com/tracing/"},{"id":110,"question":"When monitoring Docker applications, where are the tracer debug logs usually located?","type":"single_choice","options":[{"id":"A","text":"In the Datadog Agent container"},{"id":"B","text":"In the application container"},{"id":"C","text":"Both Agent and app containers."}],"correctAnswers":["B"],"answerExplanation":"The tracer debug logs would be with the application, not the Agent. These logs are not sent to the Datadog Agent in the flare and are stored in a separate path depending on your logging configuration. See: https://docs.datadoghq.com/tracing/troubleshooting/tracer_debug_logs/"},{"id":111,"question":"What information does a span in Datadog APM contain?","type":"single_choice","options":[{"id":"A","text":"A span ID, start time, end time, and duration"},{"id":"B","text":"A span name, start time, duration, and span tags"},{"id":"C","text":"An HTTP method and route"},{"id":"D","text":"Trace metrics like throughput, latency, and error rates"}],"correctAnswers":["B"],"answerExplanation":"A span represents a logical unit of work in the system for a given time period, and each span consists of a span.name, start time, duration, and span tags. See: https://docs.datadoghq.com/tracing/glossary/#spans"},{"id":112,"question":"Which of the following is recommended for a better experience when installing and getting started with Datadog?","type":"single_choice","options":[{"id":"A","text":"Following the documentation on the tracing library repo"},{"id":"B","text":"Following the quick start instructions within the Datadog app"},{"id":"C","text":"Following the documentation for a specific version"},{"id":"D","text":"None of the above"}],"correctAnswers":["B"],"answerExplanation":"Following the quick start instructions within the Datadog app is recommended for the best experience. See: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/java/?tab=containers#follow-the-in- app-documentation-recommended"},{"id":113,"question":"What is the purpose of automatic instrumentation in the PHP tracer?","type":"single_choice","options":[{"id":"A","text":"To capture requests from supported web frameworks"},{"id":"B","text":"To capture method execution time"},{"id":"C","text":"To capture unhandled exceptions"},{"id":"D","text":"All of the choices are correct."}],"correctAnswers":["D"],"answerExplanation":"Automatic instrumentation works by modifying PHP’s runtime to wrap certain functions and methods to trace them. The PHP tracer supports automatic instrumentation for several libraries, and captures method execution time, relevant trace data, such as URL and status response codes for web requests or SQL queries for database access, and unhandled exceptions, including stack traces if available. See: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/php/?tab=containers#automatic- instrumentation"},{"id":114,"question":"Which language tracers are supported by Datadog?","type":"single_choice","options":[{"id":"A","text":"Java, Python, Ruby, Go, Node.js, .NET, PHP, and C++"},{"id":"B","text":"Java, Python, Ruby, Go, Node.js, .NET, and PHP"},{"id":"C","text":"Python, Ruby, Node.js, and C++"},{"id":"D","text":"Java, Python, and Ruby"}],"correctAnswers":["A"],"answerExplanation":"Datadog supports Java, Python, Ruby, Go, Node.js, .NET, PHP, and C++ language tracers. See: https://docs.datadoghq.com/tracing/trace_collection/dd_libraries/java/"},{"id":115,"question":"What is the Go Datadog Trace Library’s version support policy for Go versions?","type":"single_choice","options":[{"id":"A","text":"The two latest releases of Go are fully supported."},{"id":"B","text":"The three latest releases of Go are fully supported."},{"id":"C","text":"The second and third latest releases of Go are fully supported."},{"id":"D","text":"The fourth and fifth latest releases of Go are fully supported."}],"correctAnswers":["A"],"answerExplanation":"The two latest releases of Go are fully supported, while the third newest release is considered in maintenance. See: https://docs.datadoghq.com/tracing/trace_collection/compatibility/go/"},{"id":116,"question":"When setting up the Java tracing library, which environment variable is used to provide an optional path to a file where configuration properties are stored?","type":"single_choice","options":[{"id":"A","text":"DD_AGENT_HOST"},{"id":"B","text":"DD_TRACE_AGENT_URL"},{"id":"C","text":"DD_TRACE_CONFIG"},{"id":"D","text":"DD_TRACE_AGENT_OPTIONS"}],"correctAnswers":["C"],"answerExplanation":"The environment variable DD_TRACE_CONFIG is used to provide an optional path to a file where configuration properties are stored. See: https://docs.datadoghq.com/tracing/trace_collection/library_config/java"},{"id":117,"question":"What's the difference between official Datadog tracing libraries and Community tracing libraries?","type":"single_choice","options":[{"id":"A","text":"Community tracing libraries are made and supported by Datadog community members."},{"id":"B","text":"There are no community tracing libraries because Datadog does not support them."},{"id":"C","text":"There are no differences because both libraries are maintained by Datadog."},{"id":"D","text":"Community tracing libraries refer to OpenTelemetry, whereas official Datadog tracing libraries are Datadog-provided SDKs."}],"correctAnswers":["A"],"answerExplanation":"Community libraries are made and supported by Datadog community members. For a list of community libraries, see: https://docs.datadoghq.com/developers/community/libraries/#apm-- continuous-profiler-client-libraries"},{"id":118,"question":"You would like to use Deployment Tracking for monitoring your blue and green deployment strategy. For how long can you investigate two versions using deployment comparison?","type":"single_choice","options":[{"id":"A","text":"7 days"},{"id":"B","text":"15 days"},{"id":"C","text":"30 days"},{"id":"D","text":"15 months"}],"correctAnswers":["C"],"answerExplanation":"You can compare any two versions within the past 30 days. See: https://docs.datadoghq.com/tracing/services/deployment_tracking/#deployment-comparison"},{"id":119,"question":"What is the default retention for trace metrics?","type":"single_choice","options":[{"id":"A","text":"7 days"},{"id":"B","text":"15 days"},{"id":"C","text":"1 month"},{"id":"D","text":"15 months"}],"correctAnswers":["D"],"answerExplanation":"Metrics from spans are treated as custom metrics which by default have a retention of 15 months. See: https://docs.datadoghq.com/tracing/trace_pipeline/generate_metrics/"},{"id":120,"question":"How do you set Unified Service Tagging for the APM tracer when running applications in Amazon Elastic Container Service (Amazon ECS)?","type":"single_choice","options":[{"id":"A","text":"B. Set them as environment variables."},{"id":"B","text":"Set them as tracer configs."},{"id":"C","text":"Set them as application profiles."},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["A"],"answerExplanation":"In the ECS task definition, set the DD_ENV, DD_SERVICE, and DD_VERSION environment variables and corresponding Docker labels in the runtime environment of each service’s container. See: https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/?tab=ecs"},{"id":121,"question":"You made a trace metric query and noticed that when grouping by the env tag, the same metric has two env tags. What could be a possible cause for this?","type":"single_choice","options":[{"id":"A","text":"B. DD_ENV is not set on some hosts."},{"id":"B","text":"DD_ENV is not set for all instances of the app."},{"id":"C","text":"Different env tags have been set on the Tracer and Agent."},{"id":"D","text":"Different env tags have been set on the Agent and host environment."}],"correctAnswers":["C"],"answerExplanation":"Setting different env tags on the Tracer and Agent may cause duplicate tagging on trace metrics. See: https://docs.datadoghq.com/tracing/guide/setting_primary_tags_to_scope/?tab=kuberneteswithouthelm# a gent-environment"},{"id":122,"question":"Datadog APM enables you to identify deployment impact, navigate seamlessly across traces, metrics, and logs, and view service data based on environment or version in a unified fashion. Which reserved tags do you set up to achieve this?","type":"single_choice","options":[{"id":"A","text":"B. env, service, version"},{"id":"B","text":"env, source, version"},{"id":"C","text":"host, service, version"},{"id":"D","text":"device, host, source"},{"id":"E","text":"device, host, service"}],"correctAnswers":["A"],"answerExplanation":"Unified service tagging ties Datadog telemetry data using env, service, and version. These three tags enable you to identify deployment impact with trace and infrastructure metrics; navigate seamlessly across traces, metrics, and logs; and view service data on each environment or version of the application. See: https://docs.datadoghq.com/getting_started/tagging/unified_service_tagging/"},{"id":123,"question":"You would like to collect pod labels so that you can set them as the second primary tags. Where should you set DD_KUBERNETES_POD_LABELS_AS_TAGS?","type":"single_choice","options":[{"id":"A","text":"B. On the Datadog Agent"},{"id":"B","text":"On the target application"},{"id":"C","text":"On the Datadog app"},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["A"],"answerExplanation":"To extract a given node label and transform it as a tag key within Datadog, you need to add DD_KUBERNETES_POD_LABELS_AS_TAGS to the Datadog Agent. See: https://docs.datadoghq.com/containers/kubernetes/tag/?tab=containerizedagent#pod-labels-as- tags"},{"id":124,"question":"What is the default value of the environment variable DD_SERVICE when instrumenting the Java tracer?","type":"single_choice","options":[{"id":"A","text":"none"},{"id":"B","text":"unnamed-java-app"},{"id":"C","text":"true"},{"id":"D","text":"null"}],"correctAnswers":["B"],"answerExplanation":"The default value of the environment variable DD_SERVICE is unnamed-java-app. See: https://docs.datadoghq.com/tracing/trace_collection/library_config/java"},{"id":125,"question":"Which of the following information can be found on the tracer debug logs?","type":"single_choice","options":[{"id":"A","text":"Whether or not traces are being generated."},{"id":"B","text":"Whether or not the application is using too much memory"},{"id":"C","text":"Whether or not the Datadog Agent is using too much CPU"},{"id":"D","text":"All the choices are included in tracer debug logs."}],"correctAnswers":["A"],"answerExplanation":"The tracer debug logs contain information for diagnosing tracer issues or audit trace data. It does not include information about the load on the Datadog Agent nor the application being monitored. The best answer is whether or not traces were generated. See: https://docs.datadoghq.com/tracing/troubleshooting/tracer_debug_logs/"},{"id":126,"question":"What is the default retention for profile metrics?","type":"single_choice","options":[{"id":"A","text":"7 days"},{"id":"B","text":"15 days"},{"id":"C","text":"1 month"},{"id":"D","text":"15 months"}],"correctAnswers":["C"],"answerExplanation":"See: https://docs.datadoghq.com/developers/guide/data-collection-resolution-retention/"},{"id":127,"question":"Which of the following is true about APM trace analytics monitors?","type":"single_choice","options":[{"id":"A","text":"Trace analytics monitors are based on indexed spans."},{"id":"B","text":"Trace an
