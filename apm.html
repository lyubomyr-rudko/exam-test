alytics monitors are based on ingested spans."},{"id":"C","text":"Trace analytics monitors are based on metrics generated from spans."},{"id":"D","text":"Trace analytics monitors are unlimited."}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/monitors/types/apm/"},{"id":128,"question":"Which of the following is responsible for indexing?","type":"single_choice","options":[{"id":"A","text":"Datadog Intelligent Retention Filter"},{"id":"B","text":"Custom Retention Filter"},{"id":"C","text":"Datadog Intelligent Retention Filter and Custom Retention Filter"},{"id":"D","text":"None of the choices."}],"correctAnswers":["C"],"answerExplanation":"The Datadog Intelligent Retention Filter indexes a proportion of traces. You can also define your own custom retention filters to index traces you need for troubleshooting or other purposes. See: https://docs.datadoghq.com/tracing/trace_pipeline/#trace-retention"},{"id":129,"question":"Which of the following is the prerequisite for doing trace analytics on the trace explorer?","type":"single_choice","options":[{"id":"A","text":"Configuring custom retention filters."},{"id":"B","text":"Configuring intelligent retention filters."},{"id":"C","text":"Configuring spans to metrics."},{"id":"D","text":"Configuring custom tagging."}],"correctAnswers":["A"],"answerExplanation":"All spans indexed by custom retention filters (not the intelligent retention filter) are available to be searched when using trace analytics. See: https://docs.datadoghq.com/tracing/trace_explorer/?tab=timeseriesview#indexed-spans-search- with-15-day-retention"},{"id":130,"question":"On the trace explorer page, what is displayed under the Live 15 Minutes option?","type":"single_choice","options":[{"id":"A","text":"Ingested spans before they have been indexed by retention filters."},{"id":"B","text":"Retained spans after they have been indexed by retention filters."},{"id":"C","text":"Ingested spans before Datadog Agent ingestion filters are applied."},{"id":"D","text":"Retained spans after they have been indexed by the Datadog Intelligent Retention Filter."}],"correctAnswers":["A"],"answerExplanation":"Live Search displays spans sent by the Datadog Agent and before they have been indexed by retention filters. See: https://docs.datadoghq.com/tracing/trace_explorer/?tab=listview#live-search-for-15-minutes"},{"id":131,"question":"Given the following span list, how do you find the database query that's taking the longest time?","type":"single_choice","options":[{"id":"A","text":"Check the SPANS column."},{"id":"B","text":"Check the spans EXEC TIME column."},{"id":"C","text":"Check the ERRORS column."},{"id":"D","text":"Check the LATENCY column."}],"correctAnswers":["A"],"answerExplanation":"The span list will have an EXEC TIME column to represent how long the database call took to execute."},{"id":132,"question":"What do the colors on the service map represent?","type":"single_choice","options":[{"id":"A","text":"Monitor status"},{"id":"B","text":"SLO status"},{"id":"C","text":"Service status"},{"id":"D","text":"Instrumentation status"}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/services/services_map/#color"},{"id":133,"question":"How do you query for database services in the Service Catalog?","type":"single_choice","options":[{"id":"A","text":"source:db"},{"id":"B","text":"type:db"},{"id":"C","text":"version:db"},{"id":"D","text":"infra_type:db"}],"correctAnswers":["B"],"answerExplanation":"The service catalog has a faceting for Type. Clicking on the type db will add a query type:db. You can confirm this on the Datadog UI. More information here: https://docs.datadoghq.com/tracing/services/services_list/#services-types"},{"id":134,"question":"What does the following Service Catalog query do? watchdog:true","type":"single_choice","options":[{"id":"A","text":"Lists services without Watchdog Alerts"},{"id":"B","text":"Lists services with Watchdog Alerts"},{"id":"C","text":"Nothing because this is not a supported query."}],"correctAnswers":["B"],"answerExplanation":"More on the service catalog here: https://docs.datadoghq.com/tracing/service_catalog/"},{"id":135,"question":"What does the following query do? env:dev @http.status_code:500 -resource_name:\"GET /generate_error\"","type":"single_choice","options":[{"id":"A","text":"Returns traces with 500 responses for the development environment except for the /generate_error endpoint."},{"id":"B","text":"Returns traces with 500 responses for the development environment for all endpoints."},{"id":"C","text":"Returns traces that either have the tag env:dev, attribute http.status_code:500, or not having the tag resource_name:\"GET /generate_error\"."},{"id":"D","text":"Nothing because this query has incorrect syntax."}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/trace_explorer/query_syntax/"},{"id":136,"question":"What does the following query do? service:(discounts OR advertisements) env:prod","type":"single_choice","options":[{"id":"A","text":"Returns all traces that are tagged env:prod from either discounts or advertisements services."},{"id":"B","text":"Returns all traces that are tagged env:prod or tagged with services discounts and advertisements."},{"id":"C","text":"Returns all traces that are not tagged with env:prod and from either discounts or advertisements services."},{"id":"D","text":"Returns all traces that are tagged env:prod and has the service tags discount and advertisement."}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/trace_explorer/query_syntax/"},{"id":137,"question":"Which of the following requires setting up APM facets?","type":"single_choice","options":[{"id":"A","text":"Ingesting spans using the Trace API"},{"id":"B","text":"Generating metrics from spans"},{"id":"C","text":"Indexing spans with retention filters"},{"id":"D","text":"None of the choices"}],"correctAnswers":["D"],"answerExplanation":"Creating facets is not required for ingesting spans, generating metrics from spans, or indexing spans. See: https://docs.datadoghq.com/tracing/trace_explorer/facets/"},{"id":138,"question":"How do you use a custom span tag called \"customer_tier\" for searching spans?","type":"single_choice","options":[{"id":"A","text":"You must create a facet for customer_tier first."},{"id":"B","text":"You can type in @customer_tier in the search bar directly."},{"id":"C","text":"The UI only supports search for default span tags."}],"correctAnswers":["B"],"answerExplanation":"You can type in @ followed by the custom span tag in the search bar directly. See syntax: https://docs.datadoghq.com/tracing/trace_explorer/query_syntax/#facet-search Creating facets is not required for searching spans. See: https://docs.datadoghq.com/tracing/trace_explorer/facets/"},{"id":139,"question":"Which tab on the trace panel shows the time taken waiting for the garbage collector to execute?","type":"single_choice","options":[{"id":"A","text":"Infrastructure"},{"id":"B","text":"Network"},{"id":"C","text":"Processes"},{"id":"D","text":"Code Hotspots"}],"correctAnswers":["D"],"answerExplanation":"Depending on the runtime and language, the code hotspots tab may contain garbage collection information which shows the time taken waiting for the garbage collector to execute. See: https://docs.datadoghq.com/profiler/connect_traces_and_profiles/"},{"id":140,"question":"How do you get alerted when your service has a high latency?","type":"single_choice","options":[{"id":"A","text":"Create a monitor."},{"id":"B","text":"Create a dashboard."},{"id":"C","text":"Create an SLO."},{"id":"D","text":"Use the trace explorer."}],"correctAnswers":["A"],"answerExplanation":"Monitors are used to send alerts. More information on APM Monitors here: https://docs.datadoghq.com/monitors/types/apm/"},{"id":141,"question":"Your food ordering portal had an incident last week. You would like to offer a discount to 100 restaurants who encountered the most errors. How do you accomplish this in Datadog APM assuming you have a custom tag for restaurant ID and name?","type":"single_choice","options":[{"id":"A","text":"B. On the trace explorer page, make a query scoping down to the service, ordering resource, and errors. Use the restaurant name for grouping. Visualize using a top list and limit the view to 100."},{"id":"B","text":"On the trace explorer page, make a query scoping down to the service, ordering resource, and restaurant name. Use the HTTP Status Code for grouping. Visualize using a top list and limit the view to 100."},{"id":"C","text":"On the trace explorer page, make a query scoping down to the restaurant name and errors. Use the service name and ordering resource name for grouping. Visualize using a top list and limit the view to 100."}],"correctAnswers":["A"],"answerExplanation":"The key is to use the restaurant name for grouping the errors. See: https://docs.datadoghq.com/tracing/trace_explorer/visualize/#top-list"},{"id":142,"question":"You are the owner of the authentication service. The frontend team gave the feedback that your authentication API takes 2 seconds to reply for some of their calls. How do you query for this on the trace explorer?","type":"single_choice","options":[{"id":"A","text":"B. service:payment-api @duration:>=2s"},{"id":"B","text":"service:payment-api @duration:2s"},{"id":"C","text":"service:payment-api @duration:high"},{"id":"D","text":"service:payment-api @duration:p99"}],"correctAnswers":["A"],"answerExplanation":"You can leverage the duration attribute to investigate latencies. For more information on the query syntax, see: https://docs.datadoghq.com/tracing/trace_explorer/query_syntax/"},{"id":143,"question":"Your web service has some 500 Internal Server Error showing up on the trace explorer page. How do you drill down and find the error message?","type":"single_choice","options":[{"id":"A","text":"B. Click on one span to open the full trace then click on the errors tab."},{"id":"B","text":"Click on one span to open the full trace then click on the span summary."},{"id":"C","text":"Click on span to navigate to the service map then check the upstream and downstream services."},{"id":"D","text":"Click on the span to open the service page and scroll down to the errors section."}],"correctAnswers":["A"],"answerExplanation":"The stack trace is captured and displayed in the error tab of the trace panel."},{"id":144,"question":"Which of the following visualization can display a list of status codes in the order of the number of times services encountered them?","type":"single_choice","options":[{"id":"A","text":"B. Timeseries"},{"id":"B","text":"List"},{"id":"C","text":"Pie Chart"},{"id":"D","text":"Top List"}],"correctAnswers":["D"],"answerExplanation":"A top list will display from highest to lowest."},{"id":145,"question":"Which Datadog user can set the Apdex score?","type":"single_choice","options":[{"id":"A","text":"Admin users"},{"id":"B","text":"Standard users"},{"id":"C","text":"Admin and standard users"},{"id":"D","text":"Read only users"}],"correctAnswers":["A"],"answerExplanation":"You need to be an administrator of your Datadog account to define your Apdex. See: https://docs.datadoghq.com/tracing/guide/configure_an_apdex_for_your_traces_with_datadog_apm/#def inition"},{"id":146,"question":"Which of the following services would support configuring the Apdex?","type":"single_choice","options":[{"id":"A","text":"Store Front Web Service"},{"id":"B","text":"Store Front Database Service"},{"id":"C","text":"Store Front Cache Service"},{"id":"D","text":"All of the choices."}],"correctAnswers":["A"],"answerExplanation":"Apdex or Application Performance Index is an open standard that defines a standardized method to report, benchmark, and track application performance. It is based on the response time of web services so databases and cache would not have it. See: https://docs.datadoghq.com/tracing/guide/configure_an_apdex_for_your_traces_with_datadog_apm/"},{"id":147,"question":"You can set the Apdex for which of the following?","type":"single_choice","options":[{"id":"A","text":"Service"},{"id":"B","text":"Database"},{"id":"C","text":"Application"},{"id":"D","text":"Version"}],"correctAnswers":["A"],"answerExplanation":"Apdex is defined per service on the service page. See: https://docs.datadoghq.com/tracing/guide/configure_an_apdex_for_your_traces_with_datadog_apm/#set -your-apdex-for-your-traces"},{"id":148,"question":"How do you create span-based metrics?","type":"single_choice","options":[{"id":"A","text":"Specify a query and dimensions on the Datadog UI."},{"id":"B","text":"Write custom instrumentation with tracing SDK."},{"id":"C","text":"Configure the Datadog Agent to collect custom metrics."}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/trace_pipeline/generate_metrics/#creating-a-span-based-metric"},{"id":149,"question":"Which of the following spans-to-metrics configurations cannot be updated?","type":"single_choice","options":[{"id":"A","text":"Metric name"},{"id":"B","text":"Aggregation groups"},{"id":"C","text":"Stream filter query"},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["A"],"answerExplanation":"After a span-based metric is created, only the stream filter query and the aggregation groups can be updated. To change the metric type or name, a new metric must be created and the old one deleted. See: https://docs.datadoghq.com/tracing/trace_pipeline/generate_metrics/#updating-existing-span- based-metri cs"},{"id":150,"question":"You own the Card Transactions API which is a critical service to end users. Your manager would like you to show the day-to-day count of requests to the credit card transaction endpoint that are successful but responded with a latency higher than 6 seconds. The manager would also like to compare 12 months worth of data going forward. How can you accomplish this with Datadog APM features?","type":"single_choice","options":[{"id":"A","text":"Create custom metrics based on spans"},{"id":"B","text":"Use the default trace metrics scoped by service, resource, and duration."},{"id":"C","text":"Make a saved view on trace explorer filtering on service, resource, and duration."},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["A"],"answerExplanation":"This use case requires creating custom metrics from spans. Default trace metrics do not contain the business logic required, and the trace explorer would not have months long of data by default. More information on generating metrics from spans here: https://docs.datadoghq.com/tracing/trace_pipeline/generate_metrics/"},{"id":151,"question":"In a tree map, which resource would have the most errors encountered? The query is status: error and the grouping is Count of all spans by Resource.","type":"single_choice","options":[{"id":"A","text":"The resource at the top of the list."},{"id":"B","text":"The resource with the largest percentage."},{"id":"C","text":"The resource with the biggest area."}],"correctAnswers":["C"],"answerExplanation":"See: https://docs.datadoghq.com/dashboards/widgets/treemap/"},{"id":152,"question":"Which of the following trace metrics represent the latency distribution for graphql.execute spans?","type":"single_choice","options":[{"id":"A","text":"trace.graphql.execute.apdex"},{"id":"B","text":"trace.graphql.execute.hits"},{"id":"C","text":"trace.graphql.execute.span_count"},{"id":"D","text":"trace.graphql.execute"},{"id":"E","text":"trace.graphql.execute.distribution"}],"correctAnswers":["D"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/metrics/metrics_namespace/#latency-distribution"},{"id":153,"question":"Which widget is best for showing dependencies between services and understanding how data flows through your architecture?","type":"single_choice","options":[{"id":"A","text":"Service Summary Widget"},{"id":"B","text":"Service Map Widget"},{"id":"C","text":"Service Network Widget"},{"id":"D","text":"Service Architecture Widget"}],"correctAnswers":["B"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/services/services_map/"},{"id":154,"question":"How much historical data can the seasonal algorithms of Anomaly Monitors use when calculating an APM metric’s expected normal range of behavior?","type":"single_choice","options":[{"id":"A","text":"A couple of weeks"},{"id":"B","text":"A couple of months"},{"id":"C","text":"A couple of years"},{"id":"D","text":"There is no limit."}],"correctAnswers":["B"],"answerExplanation":"All of the seasonal algorithms may use up to a couple of months of historical data when calculating a metric’s expected normal range of behavior. See: https://docs.datadoghq.com/monitors/types/anomaly/#anomaly-detection-algorithms"},{"id":155,"question":"Which tag do you need to configure to enable the APM deployment tracking functionality?","type":"single_choice","options":[{"id":"A","text":"version"},{"id":"B","text":"source"},{"id":"C","text":"commit"},{"id":"D","text":"release"}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/services/deployment_tracking/"},{"id":156,"question":"After setting up distributed tracing using automatic instrumentation, you noticed that Datadog is not tracing some custom business code you have in your application. How do you add depth to your trace and measure the execution of your custom business code?","type":"single_choice","options":[{"id":"A","text":"Add a custom span for the business code."},{"id":"B","text":"Add more detailed attributes to existing spans."},{"id":"C","text":"Adjust the automatic instrumentation level to high."},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["A"],"answerExplanation":"You need to add custom instrumentation to your code to complete flame graphs and to measure execution times for pieces of code. See: https://docs.datadoghq.com/tracing/trace_collection/custom_instrumentation/java/#adding-spans"},{"id":157,"question":"Which of the following is a feature for adding spans when using the Java tracer?","type":"single_choice","options":[{"id":"A","text":"Trace methods"},{"id":"B","text":"Trace annotations"},{"id":"C","text":"Both trace methods and trace annotations"},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["C"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/trace_collection/custom_instrumentation/java/#adding-spans"},{"id":158,"question":"How do you enable Code Hotspots?","type":"single_choice","options":[{"id":"A","text":"Set DD_PROFILING_ENABLED to true on the tracer."},{"id":"B","text":"It's already enabled when using a tracing library by default."},{"id":"C","text":"Run language-specific startup commands for the tracing library."}],"correctAnswers":["A"],"answerExplanation":"Code Hotspots identification is enabled when you turn on continuous profiling on the tracer. See: https://docs.datadoghq.com/profiler/connect_traces_and_profiles/#prerequisites"},{"id":159,"question":"Which of the following profile types refer to the time each function spent waiting for a lock?","type":"single_choice","options":[{"id":"A","text":"Lock Wait Time"},{"id":"B","text":"Locked Time"},{"id":"C","text":"Lock Acquires"},{"id":"D","text":"Lock Releases"}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/profiler/profile_types/?code-lang=python"},{"id":160,"question":"What sampling percentage will take effect if you set DD_TRACE_SAMPLE_RATE to 0.5?","type":"single_choice","options":[{"id":"A","text":"50%"},{"id":"B","text":"0.50%"},{"id":"C","text":"5%"},{"id":"D","text":"0%"}],"correctAnswers":["A"],"answerExplanation":"See: https://docs.datadoghq.com/tracing/trace_pipeline/ingestion_mechanisms/?tab=java"},{"id":161,"question":"Setting DD_TRACE_SAMPLE_RATE and DD_TRACE_SAMPLING_RULES controls which APM process?","type":"single_choice","options":[{"id":"A","text":"Ingestion"},{"id":"B","text":"Retention"},{"id":"C","text":"Indexing"},{"id":"D","text":"Searching"}],"correctAnswers":["A"],"answerExplanation":"DD_TRACE_SAMPLE_RATE and DD_TRACE_SAMPLING_RULES are set on the tracing library for controlling head-based sampling. See: https://docs.datadoghq.com/tracing/trace_pipeline/ingestion_mechanisms/?tab=java#in-tracing- libraries-user-defined-rules"},{"id":162,"question":"Where can you set the retention rates for retention filters?","type":"single_choice","options":[{"id":"A","text":"At the Tracing Library level"},{"id":"B","text":"At the Agent level"},{"id":"C","text":"Both at the Agent and Tracing Library levels"},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["D"],"answerExplanation":"The retention filters including the retention rate are set on the Datadog UI, not on the Agent nor tracer. See: https://docs.datadoghq.com/tracing/trace_pipeline/trace_retention/#retention-filters"},{"id":163,"question":"Which statement is true for trace metrics?","type":"single_choice","options":[{"id":"A","text":"Trace metrics are calculated based on indexed traces."},{"id":"B","text":"Trace metrics are kept with a 30-day retention policy by default."},{"id":"C","text":"Trace metrics are impacted by trace ingestion controls."},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["D"],"answerExplanation":"Trace metrics are calculated based on all traces, not impacted by trace ingestion controls, and kept with a 15-month retention policy similar to other Datadog metrics. See: https://docs.datadoghq.com/tracing/glossary/#trace-metrics"},{"id":164,"question":"What does setting DD_LOGS_INJECTION=true on the Datadog tracer do?","type":"single_choice","options":[{"id":"A","text":"Injects trace correlation identifiers into logs"},{"id":"B","text":"Injects log correlation identifiers into traces"},{"id":"C","text":"Injects correlation identifiers into logs and traces"},{"id":"D","text":"None of the choices are correct."}],"correctAnswers":["A"],"answerExplanation":"Setting DD_LOGS_INJECTION to true configures the tracer to automatically inject trace correlation identifiers into logs. See: https://docs.datadoghq.com/tracing/other_telemetry/connect_logs_and_traces/java/?tab=log4j2#automat ic-injection"},{"id":165,"question":"On the logs tab of the trace panel, logs can be correlated based on which parameter?","type":"single_choice","options":[{"id":"A","text":"Trace ID"},{"id":"B","text":"Host"},{"id":"C","text":"Container"},{"id":"D","text":"All of the choices are correct."}],"correctAnswers":["D"],"answerExplanation":"Logs can be displayed using the corresponding trace ID, host, container, and pod name. See: https://docs.datadoghq.com/tracing/troubleshooting/correlated-logs-not-showing-up-in-the-trace-id- panel/"},{"id":166,"question":"What does clicking on the logs tab of the trace panel reveal?","type":"single_choice","options":[{"id":"A","text":"Correlated app logs"},{"id":"B","text":"Correlated metrics from logs"},{"id":"C","text":"Correlated debug trace logs"},{"id":"D","text":"Correlated agent logs"}],"correctAnswers":["A"],"answerExplanation":"The logs tab will display the correlated application logs. See: https://docs.datadoghq.com/tracing/other_telemetry/connect_logs_and_traces/"},{"id":167,"question":"Which monitor uses an algorithmic feature that identifies when a metric is behaving differently than it has in the past, taking into account trends, seasonal day-of-week, and time-of-day patterns?","type":"single_choice","options":[{"id":"A","text":"Anomaly Monitor"},{"id":"B","text":"Composite Monitor"},{"id":"C","text":"Forecast Monitor"},{"id":"D","text":"APM Monitor"}],"correctAnswers":["A"],"answerExplanation":"Anomaly monitors use anomaly detection which is an algorithmic feature that identifies when a metric is behaving differently than it has in the past, taking into account trends, seasonal day-of-week, and time- of-day patterns. It is suited for metrics with strong trends and recurring patterns that are hard to monitor with threshold-based alerting. See: https://docs.datadoghq.com/monitors/types/anomaly/"},{"id":168,"question":"Which of the following is a use case for profile comparison?","type":"single_choice","options":[{"id":"A","text":"Verifying if the latest deployed fix lowers the number of memory allocations your method makes."},{"id":"B","text":"Calculating the CPU consumption for today compared to the past week."},{"id":"C","text":"Checking the performance differences between two availability zones."},{"id":"D","text":"All of the choices are correct."}],"correctAnswers":["D"],"answerExplanation":"The scenarios for profile comparison include comparing two latest deployments, two distinct time periods, and two different sets of tags (e.g. availability zone). See: https://docs.datadoghq.com/profiler/compare_profiles/#comparison-scenarios"},{"id":169,"question":"What is the difference between the Side-by-Side and Combined comparison views in Continuous Profiling?","type":"single_choice","options":[{"id":"A","text":"Side-by-Side view shows a flame graph on the left, and Combined view shows a flame graph on the right."},{"id":"B","text":"Side-by-Side view computes one flame graph that averages method timings in two profiles, and Combined view shows an averaged difference in method timings between the two queries."},{"id":"C","text":"Side-by-Side view is helpful when you want to retain the context of two profiles, and Combined view is helpful when you want to look at code performance changes in a single view."},{"id":"D","text":"None of the choices."}],"correctAnswers":["C"],"answerExplanation":"In Datadog, the Side-by-Side view is helpful when you want to retain the context of both A and B profiles, while the Combined view is helpful when you want to look at code performance changes in a single view. See: https://docs.datadoghq.com/profiler/compare_profiles#side-by-side-and-combined-comparison- views"},{"id":170,"question":"Which of the following is true for the Datadog Lambda Extension?","type":"single_choice","options":[{"id":"A","text":"It supports submitting custom metrics."},{"id":"B","text":"It supports submitting logs."},{"id":"C","text":"It supports submitting traces."},{"id":"D","text":"All of the choices are correct."}],"correctAnswers":["D"],"answerExplanation":"The Datadog Lambda Extension is an AWS Lambda Extension that supports submitting custom metrics, traces, and logs. See: https://docs.datadoghq.com/serverless/libraries_integrations/extension/"},{"id":171,"question":"How do you instrument Node.js based serverless applications using the Datadog Lambda Extension?","type":"single_choice","options":[{"id":"A","text":"Use the Datadog CLI"},{"id":"B","text":"Use AWS SAM"},{"id":"C","text":"Use Serverless Framework"},{"id":"D","text":"All choices are supported."}],"correctAnswers":["D"],"answerExplanation":"See: https://docs.datadoghq.com/serverless/installation/nodejs/?tab=datadogcli#installation"},{"id":172,"question":"The following SLO calculation refers to which key indicator? (hits - errors) / hits","type":"single_choice","options":[{"id":"A","text":"Success rate"},{"id":"B","text":"Error rate"},{"id":"C","text":"Throughput"},{"id":"D","text":"Latency"}],"correctAnswers":["A"],"answerExplanation":"The hits metrics represent the count of hits for a given span, while the error metrics represent the count of errors for a given span. The query is calculating the number of successful requests (hits - errors) divided by the total number of requests. Therefore, this is a success rate. For more information on the trace metrics, see: https://docs.datadoghq.com/tracing/metrics/metrics_namespace/"},{"id":173,"question":"Availability, latency, and throughput are examples of which of the following?","type":"single_choice","options":[{"id":"A","text":"SLI"},{"id":"B","text":"SLO"},{"id":"C","text":"SLA"},{"id":"D","text":"Error Budget"}],"correctAnswers":["A"],"answerExplanation":"Service Level Indicators (SLIs) are the metrics used to measure the level of service provided to end users. See: https://www.datadoghq.com/blog/establishing-service-level-objectives/#key-terminology"},{"id":174,"question":"Deployment tracking is useful for monitoring deployment strategies except which of the following?","type":"single_choice","options":[{"id":"A","text":"Shadow deploys"},{"id":"B","text":"Blue and green deploys"},{"id":"C","text":"Canary deploys"},{"id":"D","text":"None of the choices."}],"correctAnswers":["D"],"answerExplanation":"Deployment tracking supports all the mentioned deployment strategies. For more information, see: https://docs.datadoghq.com/tracing/services/deployment_tracking/#deployment-strategies"},{"id":175,"question":"How do you monitor rolling deployments with APM?","type":"single_choice","options":[{"id":"A","text":"Tag services with a version tag to detect error increases between two versions."},{"id":"B","text":"Tag deployments with a rolling:true tag to aggregate latencies across all rolling deploys."},{"id":"C","text":"Tag deployments with a source tag to compare service behavior between the two sources."},{"id":"D","text":"None of the choices."}],"correctAnswers":["A"],"answerExplanation":"Datadog’s deployment tracking gives you visibility into the performance of deployed code when performing a rolling deployment. Deployment tracking requires setting up the version tag on APM tracers. See: https://docs.datadoghq.com/tracing/services/deployment_tracking/#rolling-deploys"},{"id":176,"question":"Which of the following is a use case for APM error tracking?","type":"single_choice","options":[{"id":"A","text":"Detecting anomalous latencies in production services."},{"id":"B","text":"Grouping similar errors into issues to reduce noise."},{"id":"C","text":"Collecting network bottlenecks and high retransmits."},{"id":"D","text":"All are correct."}],"correctAnswers":["B"],"answerExplanation":"Error Tracking enables you to set alerts to remain informed of fatal issues that may occur, group similar errors into issues to easily identify important errors and reduce noise, and follow issues over time to know when they first started, if they are still ongoing, and how often they are occurring. See: https://docs.datadoghq.com/tracing/error_tracking/"},{"id":177,"question":"Which of the following categorizes errors collected from your backend services into issues?","type":"single_choice","options":[{"id":"A","text":"Error Tracking"},{"id":"B","text":"Service Page"},{"id":"C","text":"Trace Explorer"},{"id":"D","text":"Service List"}],"correctAnswers":["A"],"answerExplanation":"Error Tracking enables you to group errors into issues, and follow issues over time to know when they first started, if they are still ongoing, and how often they are occurring. See: https://docs.datadoghq.com/tracing/error_tracking/"},{"id":178,"question":"Which latency metric corresponds to the highest latency for a single request?","type":"single_choice","options":[{"id":"A","text":"p100"},{"id":"B","text":"p99"},{"id":"C","text":"p95"},{"id":"D","text":"p75"},{"id":"E","text":"p50"}],"correctAnswers":["A"],"answerExplanation":"p100 latency or the 100th percentile latency is the largest value in the ordered list of latencies observed. More information on Service Catalog here: https://docs.datadoghq.com/tracing/service_catalog/#performance-view"},{"id":179,"question":"To find the endpoint of a web service that has the highest traffic, you need to navigate to the service page and arrange the","type":"single_choice","options":[{"id":"A","text":"resources by which column?"},{"id":"B","text":"requests"},{"id":"C","text":"total time"},{"id":"D","text":"average latency"},{"id":"E","text":"errors"}],"correctAnswers":["B"],"answerExplanation":"Traffic to an endpoint would correspond to requests. More information here: https://docs.datadoghq.com/tracing/services/service_page/#resources"},{"id":180,"question":"The trace panel flags a span to be \">p99\". Which of the following is true for this span?","type":"single_choice","options":[{"id":"A","text":"This span's duration is slower than 99% of the traffic."},{"id":"B","text":"This span's duration is faster than 99% of the traffic."},{"id":"C","text":"This span's duration is around the general average."},{"id":"D","text":"None of the choices is correct."}],"correctAnswers":["A"],"answerExplanation":"This span's duration is >p99 out of the distribution for this resource. In other words, this span is slower than 99% of the total spans. More information on Trace View here: https://docs.datadoghq.com/tracing/trace_explorer/trace_view/?tab=spantags"}]};
const EXAM_SIZE=90;
const HISTORY_KEY="datadog-apm-exam-asked-v1";
let askedHistory=new Set(JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]"));
let examQuestions=[],currentIndex=0,correctCount=0,answered=false;

function shuffle(items){
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function startExam(){
  examQuestions=shuffle(EXAM.questions).slice(0,Math.min(EXAM_SIZE,EXAM.questions.length));
  currentIndex=0;correctCount=0;answered=false;showQuestion();
}

function showQuestion(){
  answered=false;
  const q=examQuestions[currentIndex];
  const wasAskedBefore=askedHistory.has(q.id);
  askedHistory.add(q.id);
  localStorage.setItem(HISTORY_KEY,JSON.stringify([...askedHistory]));
  progress.textContent=`Question ${currentIndex+1} / ${examQuestions.length}`;
  score.textContent=`Score: ${correctCount} / ${currentIndex}`;
  history.textContent=`${wasAskedBefore?"Asked previously":"New question"} · Seen overall: ${askedHistory.size} / ${EXAM.questionCount}`;
  question.textContent=`${q.id}. ${q.question}`;
  const inputType=q.type==="multiple_choice"?"checkbox":"radio";
  options.innerHTML="";
  q.options.forEach(option=>{
    const label=document.createElement("label");
    label.dataset.optionId=option.id;
    const input=document.createElement("input");
    input.type=inputType;input.name="answer";input.value=option.id;
    const strong=document.createElement("strong");
    strong.textContent=option.id+". ";
    label.append(input,strong,document.createTextNode(option.text));
    options.appendChild(label);
  });
  result.style.display="none";result.innerHTML="";
  checkBtn.style.display="block";checkBtn.disabled=false;nextBtn.style.display="none";
}

function checkAnswer(){
  if(answered)return;
  const q=examQuestions[currentIndex];
  const selected=[...document.querySelectorAll('input[name="answer"]:checked')].map(x=>x.value).sort();
  if(!selected.length){alert("Select an answer first.");return;}
  const correct=[...q.correctAnswers].sort();
  const isCorrect=selected.length===correct.length&&selected.every((v,i)=>v===correct[i]);
  answered=true;if(isCorrect)correctCount++;
  document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);
  document.querySelectorAll("#options label").forEach(label=>{
    const id=label.dataset.optionId;
    if(correct.includes(id))label.classList.add("correct-answer");
    else if(selected.includes(id))label.classList.add("wrong-answer");
  });
  const answerText=correct.map(id=>{
    const option=q.options.find(o=>o.id===id);
    return `${id}. ${option?option.text:""}`;
  }).join("<br>");
  const explanation=q.answerExplanation?.trim()?q.answerExplanation:"No explanation available.";
  result.style.display="block";
  result.innerHTML=`<div class="result-title">${isCorrect?"✓ Correct":"✗ Incorrect"}</div>
  <div><strong>Correct answer:</strong><br>${answerText}</div>
  <div class="explanation"><strong>Explanation:</strong><br>${explanation}</div>`;
  score.textContent=`Score: ${correctCount} / ${currentIndex+1}`;
  checkBtn.style.display="none";nextBtn.style.display="block";
  nextBtn.textContent=currentIndex+1===examQuestions.length?"Finish exam":"Next question";
}

function nextQuestion(){
  if(!answered)return;
  currentIndex++;
  if(currentIndex>=examQuestions.length){showFinalScore();return;}
  showQuestion();
}

function showFinalScore(){
  const percent=Math.round((correctCount/examQuestions.length)*100);
  progress.textContent="Exam complete";score.textContent="";
  examCard.className="card final";
  examCard.innerHTML=`<h1>${correctCount} / ${examQuestions.length}</h1>
  <p>Your score: <strong>${percent}%</strong></p>
  <p class="meta">Seen overall: ${askedHistory.size} / ${EXAM.questionCount} questions</p>
  <button id="newExamBtn">Start new 90-question exam</button>`;
  newExamBtn.onclick=()=>location.reload();
}

checkBtn.onclick=checkAnswer;
nextBtn.onclick=nextQuestion;
startExam();
</script>
