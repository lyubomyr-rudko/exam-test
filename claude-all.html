ds substantial context from what has already happened in the current conversation"}],"correctAnswers":["D"],"answerExplanation":""},{"id":41,"question":"What kinds of information can consume the Claude Code context window besides the conversation history?","type":"single_choice","options":[{"id":"A","text":"Files read, tool results, terminal output, CLAUDE.md, memory, Skills, MCP results, and subagent results"},{"id":"B","text":"Only files explicitly mentioned with `@`"},{"id":"C","text":"Only user messages and assistant replies"},{"id":"D","text":"Only shell output and Git diffs"}],"correctAnswers":["A"],"answerExplanation":""},{"id":42,"question":"What slash command should you use when Claude seems to be forgetting instructions or referencing stale decisions?","type":"single_choice","options":[{"id":"A","text":"`/memory`"},{"id":"B","text":"`/doctor`"},{"id":"C","text":"`/clear`"},{"id":"D","text":"`/context`"}],"correctAnswers":["D"],"answerExplanation":""},{"id":43,"question":"What question should you mentally associate with `/context` when diagnosing context quality?","type":"single_choice","options":[{"id":"A","text":"“Which permissions are currently denied?”"},{"id":"B","text":"“What is currently taking up Claude's attention?”"},{"id":"C","text":"“Which files changed on disk?”"},{"id":"D","text":"“Which model is Claude using?”"}],"correctAnswers":["B"],"answerExplanation":""},{"id":44,"question":"What slash command is intended for asking a small side question without adding the whole tangent to the main conversation history?","type":"single_choice","options":[{"id":"A","text":"`/btw`"},{"id":"B","text":"`/help`"},{"id":"C","text":"`/context`"},{"id":"D","text":"`/branch`"}],"correctAnswers":["A"],"answerExplanation":""},{"id":45,"question":"What is the purpose of a project-level `CLAUDE.md` file?","type":"single_choice","options":[{"id":"A","text":"A replacement for Git configuration"},{"id":"B","text":"A file that stores background task logs"},{"id":"C","tex estion":"What does the `allow` permission group represent?","type":"single_choice","options":[{"id":"A","text":"Actions that run only in Plan Mode"},{"id":"B","text":"Actions Claude may perform without prompting"},{"id":"C","text":"Actions that always require approval"},{"id":"D","text":"Actions Claude may never perform"}],"correctAnswers":["B"],"answerExplanation":""},{"id":58,"question":"What does the `ask` permission group represent?","type":"single_choice","options":[{"id":"A","text":"Actions permanently enabled"},{"id":"B","text":"Actions restricted to subagents"},{"id":"C","text":"Actions that require user approval before proceeding"},{"id":"D","text":"Actions automatically denied"}],"correctAnswers":["C"],"answerExplanation":""},{"id":59,"question":"What does the `deny` permission group represent?","type":"single_choice","options":[{"id":"A","text":"Actions Claude is not allowed to perform"},{"id":"B","text":"Actions reserved for the CLI"},{"id":"C","text":"Actions that only require confirmation"},{"id":"D","text":"Actions Claude may do silently"}],"correctAnswers":["A"],"answerExplanation":""},{"id":60,"question":"What slash command opens Claude Code permission controls?","type":"single_choice","options":[{"id":"A","text":"`/model`"},{"id":"B","text":"`/permissions`"},{"id":"C","text":"`/security-review`"},{"id":"D","text":"`/hooks`"}],"correctAnswers":["B"],"answerExplanation":""},{"id":61,"question":"In the guide's permission example, what permission rule allows Claude to run `pnpm typecheck` freely?","type":"single_choice","options":[{"id":"A","text":"Place it in `permissions.ask`"},{"id":"B","text":"Put it in CLAUDE.md only"},{"id":"C","text":"Place `Bash(pnpm typecheck)` in `permissions.allow`"},{"id":"D","text":"Place it in `permissions.deny`"}],"correctAnswers":["C"],"answerExplanation":""},{"id":62,"question":"In the guide's permission example, what permission rule requires approval before `git push`?","type":"single_choice","options":[{"id":"A","text":"Place `Bash(git push *)` in `permissions.ask`"},{"id":"B","text":"Place it in `permissions.allow`"},{"id":"C","text":"Place it in `permissions.deny`"},{"id":"D","text":"Configure it as a PostToolUse hook"}],"correctAnswers":["A"],"answerExplanation":""},{"id":63,"question":"In the guide's permission example, what permission rules prevent Claude from reading or editing `.env` files?","type":"single_choice","options":[{"id":"A","text":"Use deny rules such as `Read(.env)`, `Read(.env.*)`, `Edit(.env)`, and `Edit(.env.*)`"},{"id":"B","text":"Use a Skill that reminds Claude not to read secrets"},{"id":"C","text":"Use a prompt saying “do not touch .env”"},{"id":"D","text":"Use `/clear` before opening `.env`"}],"correctAnswers":["A"],"answerExplanation":""},{"id":64,"question":"What keyboard shortcut cycles through Claude Code permission modes?","type":"single_choice","options":[{"id":"A","text":"`Shift+Tab`"},{"id":"B","text":"`Ctrl+T`"},{"id":"C","text":"`Esc Esc`"},{"id":"D","text":"`Ctrl+Tab`"}],"correctAnswers":["A"],"answerExplanation":""},{"id":65,"question":"What is the purpose of Manual permission mode?","type":"single_choice","options":[{"id":"A","text":"Claude runs only read-only tools"},{"id":"B","text":"Claude automatically approves all tools"},{"id":"C","text":"Claude only plans and cannot inspect"},{"id":"D","text":"Claude asks more often; useful while learning or in sensitive environments"}],"correctAnswers":["D"],"answerExplanation":""},{"id":66,"question":"What is the purpose of Accept Edits permission mode?","type":"single_choice","options":[{"id":"A","text":"It forces a separate worktree for every edit"},{"id":"B","text":"All Bash commands become automatically allowed"},{"id":"C","text":"Claude cannot edit unless a Hook permits it"},{"id":"D","text":"Normal edits require less approval once you are comfortable with the task"}],"correctAnswers":["D"],"answerExplanation":""},{"id":67,"question":"What is the purpose of Plan permission mode?","type":"single_choice","options":[{"id":"A","text":"Claude investigates and proposes before implementation"},{"id":"B","text":"Claude runs only background agents"},{"id":"C","text":"Claude disables tool use"},{"id":"D","text":"Claude skips planning and edits immediately"}],"correctAnswers":["A"],"answerExplanation":""},{"id":68,"question":"What is the purpose of Auto permission mode?","type":"single_choice","options":[{"id":"A","text":"Claude disables permissions entirely"},{"id":"B","text":"Claude only allows file reads"},{"id":"C","text":"Claude always runs everything without checks"},{"id":"D","text":"Claude uses its safety system to decide whether many actions can proceed automatically"}],"correctAnswers":["D"],"answerExplanation":""},{"id":69,"question":"Why does the guide recommend checking the current permission mode rather than assuming it matches a tutorial?","type":"single_choice","options":[{"id":"A","text":"Available modes and defaults can vary by version, platform, plan, and environment"},{"id":"B","text":"Modes depend only on repository size"},{"id":"C","text":"Permission modes are fixed forever"},{"id":"D","text":"Tutorials always reflect the installed version"}],"correctAnswers":["A"],"answerExplanation":""},{"id":70,"question":"What is the main purpose of Plan Mode?","type":"single_choice","options":[{"id":"A","text":"To make edits faster with fewer prompts"},{"id":"B","text":"To inspect and reason about an approach before making normal source edits"},{"id":"C","text":"To clear stale context"},{"id":"D","text":"To isolate files in a worktree"}],"correctAnswers":["B"],"answerExplanation":""},{"id":71,"question":"What kinds of tasks does the guide recommend using Plan Mode for?","type":"single_choice","options":[{"id":"A","text":"High-impact, cross-cutting, unfamiliar, or expensive-to-reverse work benefits from an explicit plan first"},{"id":"B","text":"Plan Mode is mainly a performance optimization"},{"id":"C","text":"Plan Mode is only for UI changes"},{"id":"D","text":"Plan Mode is required for every edit"}],"correctAnswers":["A"],"answerExplanation":""},{"id":72,"question":"What kinds of small tasks does the guide say usually do not need Plan Mode?","type":"single_choice","options":[{"id":"A","text":"Authentication changes"},{"id":"B","text":"Large architectural refactors"},{"id":"C","text":"Database migrations"},{"id":"D","text":"Small, obvious edits such as text changes, margin fixes, renames, or adding an icon"}],"correctAnswers":["D"],"answerExplanation":""},{"id":73,"question":"What command can be used to enter Plan Mode with an initial task in the same line?","type":"single_choice","options":[{"id":"A","text":"`/branch <task>`"},{"id":"B","text":"`claude -p <task>`"},{"id":"C","text":"`/plan <task>`"},{"id":"D","text":"`/review <task>`"}],"correctAnswers":["C"],"answerExplanation":""},{"id":74,"question":"What should you do with a generated implementation plan before allowing normal source edits?","type":"single_choice","options":[{"id":"A","text":"Review and challenge the plan before approving implementation"},{"id":"B","text":"Delete CLAUDE.md to avoid bias"},{"id":"C","text":"Immediately compact the context"},{"id":"D","text":"Switch to Auto mode before reading it"}],"correctAnswers":["A"],"answerExplanation":""},{"id":75,"question":"What slash command opens the model selector?","type":"single_choice","options":[{"id":"A","text":"`/model`"},{"id":"B","text":"`/effort`"},{"id":"C","text":"`/context`"},{"id":"D","text":"`/doctor`"}],"correctAnswers":["A"],"answerExplanation":""},{"id":76,"question":"What kinds of tasks are appropriate for a faster model according to the guide?","type":"single_choice","options":[{"id":"A","text":"Only background tasks"},{"id":"B","text":"Only worktree creation"},{"id":"C","text":"Architecture, security review, subtle debugging, large refactors"},{"id":"D","text":"Simple edits, renaming, formatting, routine CRUD, basic tests, straightforward components"}],"correctAnswers":["D"],"answerExplanation":""},{"id":77,"question":"What kinds of tasks are appropriate for a stronger reasoning model according to the guide?","type":"single_choice","options":[{"id":"A","text":"Button text changes and formatting only"},{"id":"B","text":"Architecture, subtle debugging, database design, security review, large refactors, deep review, unfamiliar legacy code"},{"id":"C","text":"Only MCP configuration"},{"id":"D","text":"Only shell command execution"}],"correctAnswers":["B"],"answerExplanation":""},{"id":78,"question":"What slash command changes reasoning effort without changing the model?","type":"single_choice","options":[{"id":"A","text":"`/plan`"},{"id":"B","text":"`/model`"},{"id":"C","text":"`/effort`"},{"id":"D","text":"`/permissions`"}],"correctAnswers":["C"],"answerExplanation":""},{"id":79,"question":"What is the conceptual difference between model selection and reasoning effort?","type":"single_choice","options":[{"id":"A","text":"Model controls Bash access; effort controls Git"},{"id":"B","text":"Model and effort are two names for the same setting"},{"id":"C","text":"Effort changes permissions; model changes context size"},{"id":"D","text":"Model selects the underlying capability; effort controls how hard that model reasons on the task"}],"correctAnswers":["D"],"answerExplanation":""},{"id":80,"question":"What kinds of tasks justify higher reasoning effort according to the guide?","type":"single_choice","options":[{"id":"A","text":"Running `git status`"},{"id":"B","text":"Complex debugging or architecture where deeper reasoning materially helps"},{"id":"C","text":"Changing a button label"},{"id":"D","text":"Mentioning a file with `@`"}],"correctAnswers":["B"],"answerExplanation":""},{"id":81,"question":"What is a Claude Code Skill?","type":"single_choice","options":[{"id":"A","text":"A background agent session"},{"id":"B","text":"A reusable process Claude can follow"},{"id":"C","text":"A permission mode"},{"id":"D","text":"A persistent memory database"}],"correctAnswers":["B"],"answerExplanation":""},{"id":82,"question":"Where do project Skills live by default?","type":"single_choice","options":[{"id":"A","text":"`.claude/skills/`"},{"id":"B","text":"`.claude/agents/`"},{"id":"C","text":"`.claude/hooks/`"},{"id":"D","text":"`.claude/worktrees/`"}],"correctAnswers":["A"],"answerExplanation":""},{"id":83,"question":"What file name defines a Skill inside its Skill directory?","type":"single_choice","options":[{"id":"A","text":"`CLAUDE.md`"},{"id":"B","text":"`SKILL.md`"},{"id":"C","text":"`AGENT.md`"},{"id":"D","text":"`skill.yaml`"}],"correctAnswers":["B"],"answerExplanation":""},{"id":84,"question":"What special variable is used in a Skill to receive the arguments passed when invoking it?","type":"single_choice","options":[{"id":"A","text":"`$INPUT`"},{"id":"B","text":"`$TASK`"},{"id":"C","text":"`$ARGUMENTS`"},{"id":"D","text":"`$PROMPT`"}],"correctAnswers":["C"],"answerExplanation":""},{"id":85,"question":"What signs indicate that a repeated prompt sequence should probably become a Skill?","type":"single_choice","options":[{"id":"A","text":"You want to connect to an external SaaS"},{"id":"B","text":"You need a single one-off clarification"},{"id":"C","text":"You repeatedly type the same ordered workflow, checks, conventions, tests, and reporting steps"},{"id":"D","text":"You want to deny a dangerous command"}],"correctAnswers":["C"],"answerExplanation":""},{"id":86,"question":"How can a Skill include live shell command output in its instructions?","type":"single_choice","options":[{"id":"A","text":"Convert the command into an MCP server"},{"id":"B","text":"Use a worktree for every command"},{"id":"C","text":"Store command output in memory permanently"},{"id":"D","text":"Embed command substitution/live command output directly in the Skill content"}],"correctAnswers":["D"],"answerExplanation":""},{"id":87,"question":"What command example from the guide injects the current Git diff into a dynamic Skill?","type":"single_choice","options":[{"id":"A","text":"`$GIT_DIFF`"},{"id":"B","text":"`/diff HEAD`"},{"id":"C","text":"``!`git diff HEAD` `` inside the Skill content"},{"id":"D","text":"`@git diff HEAD`"}],"correctAnswers":["C"],"answerExplanation":""},{"id":88,"question":"What is a Claude Code subagent?","type":"single_choice","options":[{"id":"A","text":"A saved prompt template only"},{"id":"B","text":"Another Claude worker with its own context"},{"id":"C","text":"A Git worktree with no model"},{"id":"D","text":"A hook that runs asynchronously"}],"correctAnswers":["B"],"answerExplanation":""},{"id":89,"question":"What three characteristics does the guide emphasize as the important properties of a subagent?","type":"single_choice","options":[{"id":"A","text":"Separate context, a focused task, and a useful result returned to the main agent"},{"id":"B","text":"A new model, new repository, and new API key"},{"id":"C","text":"Shared full context, shared filesystem lock, and no return value"},{"id":"D","text":"A hook, a Skill, and an MCP server"}],"correctAnswers":["A"],"answerExplanation":""},{"id":90,"question":"What slash command is used to manage subagents and reusable agent configurations?","type":"single_choice","options":[{"id":"A","text":"`/tasks`"},{"id":"B","text":"`/background`"},{"id":"C","text":"`/agents`"},{"id":"D","text":"`claude agents`"}],"correctAnswers":["C"],"answerExplanation":""},{"id":91,"question":"Where are custom subagent definition files stored in a project?","type":"single_choice","options":[{"id":"A","text":"`.claude/agents/`"},{"id":"B","text":"`.claude/worktrees/`"},{"id":"C","text":"`.claude/mcp/`"},{"id":"D","text":"`.claude/skills/`"}],"correctAnswers":["A"],"answerExplanation":""},{"id":92,"question":"What frontmatter field gives a custom subagent its name?","type":"single_choice","options":[{"id":"A","text":"`agent`"},{"id":"B","text":"`name`"},{"id":"C","text":"`label`"},{"id":"D","text":"`id`"}],"correctAnswers":["B"],"answerExplanation":""},{"id":93,"question":"What frontmatter field describes when a custom subagent should be used?","type":"single_choice","options":[{"id":"A","text":"`description`"},{"id":"B","text":"`when`"},{"id":"C","text":"`purpose`"},{"id":"D","text":"`summary`"}],"correctAnswers":["A"],"answerExplanation":""},{"id":94,"question":"What frontmatter field restricts which tools a custom subagent can use?","type":"single_choice","options":[{"id":"A","text":"`tools`"},{"id":"B","text":"`capabilities`"},{"id":"C","text":"`permissions` only"},{"id":"D","text":"`allowTools`"}],"correctAnswers":["A"],"answerExplanation":""},{"id":95,"question":"What slash command shows running background work such as subagents, Bash commands, forks, or detached work?","type":"single_choice","options":[{"id":"A","text":"`/context`"},{"id":"B","text":"`/tasks`"},{"id":"C","text":"`/agents`"},{"id":"D","text":"`claude agents`"}],"correctAnswers":["B"],"answerExplanation":""},{"id":96,"question":"What are the two slash commands shown for detaching the current Claude Code session into the background?","type":"single_choice","options":[{"id":"A","text":"`claude --bg` and `/plan`"},{"id":"B","text":"`/tasks` and `/agents`"},{"id":"C","text":"`/fork` and `/branch`"},{"id":"D","text":"`/background` and `/bg`"}],"correctAnswers":["D"],"answerExplanation":""},{"id":97,"question":"What CLI command starts a new Claude Code task directly in the background?","type":"single_choice","options":[{"id":"A","text":"`claude --bg \"task\"`"},{"id":"B","text":"`claude attach \"task\"`"},{"id":"C","text":"`claude -w \"task\"`"},{"id":"D","text":"`claude -p \"task\"`"}],"correctAnswers":["A"],"answerExplanation":""},{"id":98,"question":"What CLI command lists or manages multiple background Claude sessions in Agent View?","type":"single_choice","options":[{"id":"A","text":"`/agents`"},{"id":"B","text":"`claude agents`"},{"id":"C","text":"`claude tasks`"},{"id":"D","text":"`claude list`"}],"correctAnswers":["B"],"answerExplanation":""},{"id":99,"question":"What CLI command attaches to a specific background Claude session by ID?","type":"single_choice","options":[{"id":"A","text":"`claude attach <id>`"},{"id":"B","text":"`claude -r <id>`"},{"id":"C","text":"`claude agents <id>`"},{"id":"D","text":"`claude logs <id>`"}],"correctAnswers":["A"],"answerExplanation":""},{"id":100,"question":"What CLI commands show logs for and stop a background Claude session by ID?","type":"single_choice","options":[{"id":"A","text":"`claude logs <id>` and `claude stop <id>`"},{"id":"B","text":"`/tasks <id>` and `/rewind <id>`"},{"id":"C","text":"`claude inspect <id>` and `claude kill <id>`"},{"id":"D","text":"`claude attach <id>` and `claude clear <id>`"}],"correctAnswers":["A"],"answerExplanation":""},{"id":101,"question":"You are deep into an authentication refactor and the context window is getting crowded, but the task is still the same. Which Claude Code mechanism should you use, and what key information should you preserve when invoking it?","type":"single_choice","options":[{"id":"A","text":"Use `/doctor` to shrink the context window"},{"id":"B","text":"Use `/branch` and abandon the original session"},{"id":"C","text":"Use `/clear` so Claude forgets the refactor entirely"},{"id":"D","text":"Use `/compact` and explicitly preserve the authentication decisions, constraints, unresolved issues, and current state"}],"correctAnswers":["D"],"answerExplanation":""},{"id":102,"question":"You finish debugging authentication and immediately move to an unrelated storefront redesign. Which context-management command best prevents irrelevant prior reasoning from contaminating the new task, and why?","type":"single_choice","options":[{"id":"A","text":"Use `/fork` because every unrelated task should inherit context"},{"id":"B","text":"Use `/clear` because the new task is unrelated and old authentication context is noise"},{"id":"C","text":"Use `/compact` because all prior authentication details should stay"},{"id":"D","text":"Use `/memory` to copy the whole session permanently"}],"correctAnswers":["B"],"answerExplanation":""},{"id":103,"question":"You want to explore a second schema design without losing the current design conversation. Which Claude Code feature should you use, and how is that different from clearing the conversation?","type":"single_choice","options":[{"id":"A","text":"Use a worktree; it branches conversation state"},{"id":"B","text":"Use `/clear`; it preserves both alternatives automatically"},{"id":"C","text":"Use `/branch`; it creates an alternate conversation from the current point while preserving the original"},{"id":"D","text":"Use `/rewind`; it creates two simultaneous conversations"}],"correctAnswers":["C"],"answerExplanation":""},{"id":104,"question":"A side task depends heavily on the entire discussion that has already happened in the current conversation. Why might `/fork` be more appropriate than a normal subagent for that task?","type":"single_choice","options":[{"id":"A","text":"Use `/batch` because every contextual side task should be split into PRs"},{"id":"B","text":"Use a normal subagent because it always inherits more context than a fork"},{"id":"C","text":"Use `/fork` when it can inherit the current conversation history needed by the side task"},{"id":"D","text":"Use `/clear` first so the side task has maximum context"}],"correctAnswers":["C"],"answerExplanation":""},{"id":105,"question":"You need a focused investigation that should not inherit all of the main conversation history. Which Claude Code feature is designed for this, and what should the main agent receive back from it?","type":"single_choice","options":[{"id":"A","text":"Use `/clear` because separate workers are unnecessary"},{"id":"B","text":"Use MCP because isolation is an external-system problem"},{"id":"C","text":"Use a subagent; give it focused context and have it return findings to the main agent"},{"id":"D","text":"Use `/fork` because zero context inheritance is required"}],"correctAnswers":["C"],"answerExplanation":""},{"id":106,"question":"You are debugging why Claude keeps repeating stale assumptions. What should you inspect first, and which command helps you understand what is consuming Claude's attention?","type":"single_choice","options":[{"id":"A","text":"Switch worktrees because context problems are filesystem problems"},{"id":"B","text":"Run `/doctor` first because stale assumptions are installation errors"},{"id":"C","text":"Use `/diff` because changed files control memory"},{"id":"D","text":"Inspect context with `/context` to see what is consuming attention and causing stale behavior"}],"correctAnswers":["D"],"answerExplanation":""},{"id":107,"question":"You need to ask a quick implementation question without polluting the main conversation history. Which command is appropriate, and what problem does it solve?","type":"single_choice","options":[{"id":"A","text":"Use `/tasks`; it isolates questions from context"},{"id":"B","text":"Use `/branch`; every small question should branch"},{"id":"C","text":"Use `/btw`; it answers the side question without adding the whole tangent to the main history"},{"id":"D","text":"Use `/clear`; it discards the entire main task"}],"correctAnswers":["C"],"answerExplanation":""},{"id":108,"question":"A project has permanent rules about package manager, test commands, ORM choice, and migration policy. Why should these live in `CLAUDE.md` rather than a Skill or Hook?","type":"single_choice","options":[{"id":"A","text":"Because CLAUDE.md is loaded only once and then discarded"},{"id":"B","text":"Because Skills cannot contain text rules"},{"id":"C","text":"Because `CLAUDE.md` is persistent project context, while Skills define repeatable processes and Hooks automate events"},{"id":"D","text":"Because Hooks are the only place for architecture conventions"}],"correctAnswers":["C"],"answerExplanation":""},{"id":109,"question":"You repeatedly ask Claude to inspect existing code, follow conventions, implement, test, and report results in the same structure. What Claude Code abstraction should this become, and why?","type":"single_choice","options":[{"id":"A","text":"Put it in permissions because workflows are access-control rules"},{"id":"B","text":"Create a Skill because the sequence is a repeatable workflow"},{"id":"C","text":"Use MCP because repetition implies an external service"},{"id":"D","text":"Create a Hook because every repeated process must run automatically"}],"correctAnswers":["B"],"answerExplanation":""},{"id":110,"question":"You need Prettier to run automatically every time Claude edits or writes a file. Why is a Hook stronger than a Skill or prompt for this requirement?","type":"single_choice","options":[{"id":"A","text":"A Hook is deterministic and event-triggered, so formatting runs automatically instead of relying on Claude to remember"},{"id":"B","text":"A Skill is stronger because Skills always execute automatically after edits"},{"id":"C","text":"Permissions are stronger because they can run Prettier"},{"id":"D","text":"A prompt is stronger because natural-language instructions cannot be skipped"}],"correctAnswers":["A"],"answerExplanation":""},{"id":111,"question":"You must guarantee that Claude cannot read or edit `.env` files. Which Claude Code control should enforce this, and why is a prompt instruction insufficient?","type":"single_choice","options":[{"id":"A","text":"Use `/security-review` before every file read"},{"id":"B","text":"Use permission deny rules for reading/editing `.env`; permissions enforce capability boundaries"},{"id":"C","text":"Put “never read .env” in CLAUDE.md only"},{"id":"D","text":"Add a Skill that warns Claude after opening `.env`"}],"correctAnswers":["B"],"answerExplanation":""},{"id":112,"question":"You want Claude to be allowed to run `pnpm test` freely but require confirmation before `git push`. How should these actions be classified in permission rules?","type":"single_choice","options":[{"id":"A","text":"Ask for `pnpm test`; allow `git push`"},{"id":"B","text":"Allow both and rely on a prompt"},{"id":"C","text":"Allow `pnpm test`; put `git push` in `ask`"},{"id":"D","text":"Deny both actions"}],"correctAnswers":["C"],"answerExplanation":""},{"id":113,"question":"A teammate says they are in 'Auto' mode because a tutorial showed it. What should you verify before relying on that assumption, and why can this vary?","type":"single_choice","options":[{"id":"A","text":"Check the model name because it determines permission mode"},{"id":"B","text":"Assume the tutorial is authoritative because modes are global"},{"id":"C","text":"Check the actual current mode because modes and behavior can vary by version/environment"},{"id":"D","text":"Check only the repository's Git branch"}],"correctAnswers":["C"],"answerExplanation":""},{"id":114,"question":"You need Claude to investigate architecture before touching code. Which mode or command should you use, and what behavior should you expect before implementation begins?","type":"single_choice","options":[{"id":"A","text":"Use `/review`; it will implement after reviewing"},{"id":"B","text":"Use `/background`; detaching forces planning"},{"id":"C","text":"Use Plan Mode via `/plan`; Claude should inspect and propose before normal source edits"},{"id":"D","text":"Use `/compact`; compaction prevents edits"}],"correctAnswers":["C"],"answerExplanation":""},{"id":115,"question":"Why is Plan Mode appropriate for database migrations but usually unnecessary for changing button text or fixing a margin?","type":"single_choice","options":[{"id":"A","text":"Plan Mode is required only when using MCP"},{"id":"B","text":"Small edits cannot be planned"},{"id":"C","text":"Plan Mode only works on database files"},{"id":"D","text":"Migrations are cross-cutting and expensive to reverse; trivial UI edits usually have obvious low-risk implementation paths"}],"correctAnswers":["D"],"answerExplanation":""},{"id":116,"question":"You are reviewing a proposed schema change. What kinds of questions should you ask the plan before allowing implementation, according to the guide's workflow philosophy?","type":"single_choice","options":[{"id":"A","text":"Focus only on which model is selected"},{"id":"B","text":"Only ask how many lines the diff will contain"},{"id":"C","text":"Ask Claude to skip tradeoffs and start coding"},{"id":"D","text":"Challenge assumptions, schema choices, migration path, API impact, and what existing code could break"}],"correctAnswers":["D"],"answerExplanation":""},{"id":117,"question":"You have a straightforward rename task but are currently using a stronger reasoning model at high effort. How should you think about model choice and effort separately?","type":"single_choice","options":[{"id":"A","text":"Model choice is irrelevant because effort controls everything"},{"id":"B","text":"Always use the strongest model at maximum effort"},{"id":"C","text":"Use a faster model/lower effort for the rename; model capability and reasoning effort are independent choices"},{"id":"D","text":"Lower effort automatically switches to a smaller model"}],"correctAnswers":["C"],"answerExplanation":""},{"id":118,"question":"A concurrency bug occasionally creates duplicate orders. Why would increasing reasoning effort be justified here even if you keep the same model?","type":"single_choice","options":[{"id":"A","text":"Concurrency bugs involve subtle timing and causality, so more reasoning depth can help without requiring a model change"},{"id":"B","text":"Effort changes filesystem isolation, which fixes races"},{"id":"C","text":"Higher effort is only for formatting"},{"id":"D","text":"Higher effort automatically increases trace retention"}],"correctAnswers":["A"],"answerExplanation":""},{"id":119,"question":"You are building a reusable `/build-ui` Skill. What should its `SKILL.md` contain to ensure Claude inspects existing UI patterns before implementation and verifies the result afterward?","type":"single_choice","options":[{"id":"A","text":"Put all rules in a PostToolUse hook only"},{"id":"B","text":"Store UI conventions in an MCP server"},{"id":"C","text":"Create a worktree named `build-ui`"},{"id":"D","text":"Define a reusable SKILL.md workflow with pre-implementation inspection, implementation conventions, and verification steps"}],"correctAnswers":["D"],"answerExplanation":""},{"id":120,"question":"A Skill needs to review the current Git diff without you manually pasting it. What capability should the Skill use, and what does this demonstrate about dynamic Skills?","type":"single_choice","options":[{"id":"A","text":"Store the diff permanently in CLAUDE.md"},{"id":"B","text":"Use live command output such as ``!`git diff HEAD` `` in the Skill; dynamic Skills can inject current state"},{"id":"C","text":"Use `@git` because Skills cannot execute commands"},{"id":"D","text":"Use `/diff` manually and paste it every time"}],"correctAnswers":["B"],"answerExplanation":""},{"id":121,"question":"You want a custom review agent to inspect a completed feature with fresh context and only use Read, Grep, and Glob. How would this be represented conceptually in the agent configuration?","type":"single_choice","options":[{"id":"A","text":"Create a Skill because tools cannot be restricted on agents"},{"id":"B","text":"Define a custom agent file with `tools: Read, Grep, Glob` and a review-focused description"},{"id":"C","text":"Put `Read, Grep, Glob` in the main session's model selector"},{"id":"D","text":"Use a Hook matcher named `feature-reviewer`"}],"correctAnswers":["B"],"answerExplanation":""},{"id":122,"question":"Why is the main advantage of subagents not that they are 'AI experts,' but that they isolate context and return focused findings?","type":"single_choice","options":[{"id":"A","text":"Subagents are valuable mainly because they always use a stronger model"},{"id":"B","text":"Isolation keeps large investigations from polluting the main context while returning only useful findings"},{"id":"C","text t or reattach to that work?","type":"single_choice","options":[{"id":"A","text":"Use `/batch`; then inspect with `/diff`"},{"id":"B","text":"Use `/clear`; then resume with `/memory`"},{"id":"C","text":"Use `/background` or `/bg`; later use `claude agents`, `claude attach <id>`, or `claude logs <id>`"},{"id":"D","text":"Use `/branch`; later use `git checkout`"}],"correctAnswers":["C"],"answerExplanation":""},{"id":127,"question":"You need to launch a background task directly from the CLI instead of starting interactively first. What command pattern does the guide recommend?","type":"single_choice","options":[{"id":"A","text":"`claude -c \"task\"`"},{"id":"B","text":"`claude -p \"task\"`"},{"id":"C","text":"`claude --worktree \"task\"`"},{"id":"D","text":"`claude --bg \"task\"`"}],"correctAnswers":["D"],"answerExplanation":""},{"id":128,"question":"Two Claude sessions need to edit the same repository at the same time without colliding on files. What isolation mechanism should you use, and what problem does it solve?","type":"single_choice","options":[{"id":"A","text":"Use Git worktrees so each session edits an isolated checkout"},{"id":"B","text":"Use `/compact` because it isolates files"},{"id":"C","text":"Use a Skill because Skills create separate filesystems"},{"id":"D","text":"Use `/context` because it prevents merge conflicts"}],"correctAnswers":["A"],"answerExplanation":""},{"id":129,"question":"Why does a subagent provide context isolation while a worktree provides filesystem isolation, and when would you combine both?","type":"single_choice","options":[{"id":"A","text":"Subagents isolate files while worktrees isolate conversation history"},{"id":"B","text":"Subagents isolate reasoning/context; worktrees isolate files. Combine them when delegated work also edits code independently"},{"id":"C","text":"Worktrees are only for read-only agents"},{"id":"D","text":"They are interchangeable"}],"correctAnswers":["B"],"answerExplanation":""},{"id":130,"question":"You want a custom agent to always edit code in an isolated checkout. What configuration concept enables this?","type":"single_choice","options":[{"id":"A","text":"Put `/worktree` in CLAUDE.md"},{"id":"B","text":"Set `background: false`"},{"id":"C","text":"Set `tools: Worktree`"},{"id":"D","text":"Configure the custom agent with `isolation: worktree`"}],"correctAnswers":["D"],"answerExplanation":""},{"id":131,"question":"You have a monorepo-wide migration from Jest to Vitest. Why is `/batch` a strong fit, and what property of the task makes it suitable?","type":"single_choice","options":[{"id":"A","text":"Because `/batch` disables code review"},{"id":"B","text":"Because `/batch` is best for tightly coupled architecture"},{"id":"C","text":"Because the migration is large and naturally divisible into many independent mechanical units"},{"id":"D","text":"Because `/batch` is required for any change over 100 files"}],"correctAnswers":["C"],"answerExplanation":""},{"id":132,"question":"You have a large checkout feature with tightly coupled architecture decisions. Why might `/batch` be a poor fit even though the task is large?","type":"single_choice","options":[{"id":"A","text":"`/batch` cannot edit application code"},{"id":"B","text":"Checkout may contain tightly coupled decisions that cannot safely be divided into independent pieces"},{"id":"C","text":"Checkout is too small for planning"},{"id":"D","text":"Worktrees cannot contain frontend code"}],"correctAnswers":["B"],"answerExplanation":""},{"id":133,"question":"Describe the high-level lifecycle of a `/batch` operation from initial research through independent implementation units.","type":"single_choice","options":[{"id":"A","text":"Create one subagent, disable worktrees, and merge automatically"},{"id":"B","text":"Research the codebase, split into independent units, review/approve the plan, dispatch units to background subagents in isolated worktrees, then implement/test/open PRs"},{"id":"C","text":"Start with a security re ed or removed. Which hook events does the guide identify for this?","type":"single_choice","options":[{"id":"A","text":"`PreCompact` and `PostCompact`"},{"id":"B","text":"`SessionStart` and `Stop`"},{"id":"C","text":"`SubagentStart` and `SubagentStop`"},{"id":"D","text":"`WorktreeCreate` and `WorktreeRemove`"}],"correctAnswers":["D"],"answerExplanation":""},{"id":146,"question":"You are choosing between `CLAUDE.md`, Skill, Hook, MCP, Subagent, Worktree, and Agent Team. What problem does each abstraction primarily solve?","type":"single_choice","options":[{"id":"A","text":"CLAUDE.md=permissions; Skill=external API; Hook=memory; MCP=filesystem isolation; Subagent=formatter; Worktree=model switcher; Agent Team=single prompt"},{"id":"B","text":"CLAUDE.md=persistent context; Skill=repeatable workflow; Hook=automatic lifecycle action; MCP=external system; Subagent=isolated delegated thinking; Worktree=isolated files; Agent Team=coordinated multiple agents"},{"id":"C","text":"Skills and Hooks both mean filesystem isolation, while MCP and Worktrees mean context isolation"},{"id":"D","text":"All seven are different names for saved prompts"}],"correctAnswers":["B"],"answerExplanation":""},{"id":147,"question":"You know the exact file that matters for a bug. Why is using `@path/to/file` better than vaguely asking Claude to search the authentication code?","type":"single_choice","options":[{"id":"A","text":"Because file mentions bypass permissions"},{"id":"B","text":"Because `@` creates a worktree"},{"id":"C","text":"Because `@` automatically edits the file without review"},{"id":"D","text":"Because `@path/to/file` precisely scopes Claude to the known relevant artifact and reduces unnecessary search/context"}],"correctAnswers":["D"],"answerExplanation":""},{"id":148,"question":"You want to run `pnpm test` immediately and keep its output in the current conversation without waiting for Claude to decide whether to run it. Which interaction syntax should you use?","type":"single_choice","options":[{"id":"A","text":"Use `claude -p pnpm test` inside the session"},{"id":"B","text":"Use `/tasks pnpm test`"},{"id":"C","text":"Prefix it with `!`, e.g. `!pnpm test`"},{"id":"D","text":"Use `@pnpm test`"}],"correctAnswers":["C"],"answerExplanation":""},{"id":149,"question":"Claude Code itself appears broken after changes to settings and hooks. Why should `/doctor` be used before debugging the application code?","type":"single_choice","options":[{"id":"A","text":"Because `/doctor` rewrites broken source files"},{"id":"B","text":"Because `/doctor` is for Claude Code installation, settings, hook, plugin, MCP, and environment issues"},{"id":"C","text":"Because `/doctor` fixes application bugs automatically"},{"id":"D","text":"Because `/doctor` is required before any code review"}],"correctAnswers":["B"],"answerExplanation":""},{"id":150,"question":"Design an expert workflow for a risky feature that combines Plan Mode, implementation, `/diff`, tests, independent review, security review, CLAUDE.md updates, and context cleanup. In what order should these steps occur?","type":"single_choice","options":[{"id":"A","text":"Start with `/clear`, update CLAUDE.md with temporary notes, then use `/batch` for every step"},{"id":"B","text":"Run `/security-review` first, disable permissions, implement in Auto mode, and skip independent review"},{"id":"C","text":"Implement immediately, then use `/plan`, skip tests, clear context, and finally run `/diff`"},{"id":"D","text":"Plan first, challenge/review the plan, implement, verify, inspect `/diff`, run tests, use fresh `/review`, run `/security-review` when appropriate, update CLAUDE.md for permanent rule changes, then `/compact` if continuing or `/clear` for unrelated work"}],"correctAnswers":["D"],"answerExplanation":""}]};
const EXAM_SIZE = 150;
const HISTORY_KEY = "claude-code-all-seen-v1";
const ACTIVE_EXAM_KEY = "claude-code-all-active-exam-v1";
const EXAM_STATE_PREFIX = "claude-code-all-exam-state-v1:";

let askedHistory = new Set(readJson(HISTORY_KEY, []));
let examId = "";
let questionIds = [];
let examQuestions = [];
let currentIndex = 0;
let correctCount = 0;
let answers = {};

function readJson(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  } catch { return fallback; }
}

function writeJson(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function hashString(value) {
  let h = 2166136261;
  for (let i = 0; i < value.length; i++) {
    h ^= value.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function seededRandom(seed) {
  let state = seed >>> 0;
  return function() {
    state += 0x6D2B79F5;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function getDisplayOptions(q) {
  const copy = q.options.map(option => ({ ...option }));
  const rand = seededRandom(hashString(examId + ":" + q.id));
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.map((option, index) => ({
    originalId: option.id,
    displayId: String.fromCharCode(65 + index),
    text: option.text
  }));
}

function makeExamId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}

function generateQuestionIds() {
  return shuffle(EXAM.questions.map(q => q.id)).slice(0, Math.min(EXAM_SIZE, EXAM.questions.length));
}

function isValidQuestionIds(ids) {
  if (!Array.isArray(ids) || ids.length !== Math.min(EXAM_SIZE, EXAM.questions.length)) return false;
  if (new Set(ids).size !== ids.length) return false;
  const valid = new Set(EXAM.questions.map(q => q.id));
  return ids.every(id => valid.has(id));
}

function parseQuestionIdsFromUrl() {
  const raw = new URLSearchParams(location.search).get("q");
  if (!raw) return null;
  const ids = raw.split(",").map(Number).filter(Number.isInteger);
  return isValidQuestionIds(ids) ? ids : null;
}

function updateUrl() {
  const params = new URLSearchParams();
  params.set("exam", examId);
  params.set("q", questionIds.join(","));
  history.replaceState(null, "", location.pathname + "?" + params.toString() + location.hash);
}

function stateKey() { return EXAM_STATE_PREFIX + examId; }

function saveState() {
  writeJson(stateKey(), { examId, questionIds, currentIndex, correctCount, answers });
  writeJson(ACTIVE_EXAM_KEY, { examId, questionIds });
}

function loadExam() {
  const params = new URLSearchParams(location.search);
  const fromUrl = parseQuestionIdsFromUrl();
  const urlExamId = params.get("exam");

  if (fromUrl) {
    questionIds = fromUrl;
    examId = urlExamId || makeExamId();
  } else {
    const active = readJson(ACTIVE_EXAM_KEY, null);
    if (active && active.examId && isValidQuestionIds(active.questionIds)) {
      examId = active.examId;
      questionIds = active.questionIds;
    } else {
      examId = makeExamId();
      questionIds = generateQuestionIds();
    }
  }

  const byId = new Map(EXAM.questions.map(q => [q.id, q]));
  examQuestions = questionIds.map(id => byId.get(id));

  const saved = readJson(stateKey(), null);
  if (saved && saved.examId === examId && JSON.stringify(saved.questionIds) === JSON.stringify(questionIds)) {
    currentIndex = Math.max(0, Math.min(Number(saved.currentIndex) || 0, examQuestions.length));
    correctCount = Math.max(0, Number(saved.correctCount) || 0);
    answers = saved.answers && typeof saved.answers === "object" ? saved.answers : {};
  } else {
    currentIndex = 0;
    correctCount = 0;
    answers = {};
  }

  updateUrl();
  saveState();
  currentIndex >= examQuestions.length ? showFinalScore() : showQuestion();
}

function showQuestion() {
  const q = examQuestions[currentIndex];
  const savedAnswer = answers[q.id] || null;
  const wasAskedBefore = askedHistory.has(q.id);

  askedHistory.add(q.id);
  writeJson(HISTORY_KEY, [...askedHistory]);

  progress.textContent = `Question ${currentIndex + 1} / ${examQuestions.length}`;
  score.textContent = `Score: ${correctCount} / ${currentIndex}`;
  history.textContent = `${wasAskedBefore ? "Asked previously" : "New question"} · Seen overall: ${askedHistory.size} / ${EXAM.questionCount}`;
  question.textContent = `${q.id}. ${q.question}`;

  const inputType = q.type === "multiple_choice" ? "checkbox" : "radio";
  options.innerHTML = "";

  const displayOptions = getDisplayOptions(q);
  displayOptions.forEach(option => {
    const label = document.createElement("label");
    label.dataset.originalId = option.originalId;
    label.dataset.displayId = option.displayId;
    const input = document.createElement("input");
    input.type = inputType;
    input.name = "answer";
    input.value = option.originalId;
    if (savedAnswer && savedAnswer.selected.includes(option.originalId)) input.checked = true;
    const strong = document.createElement("strong");
    strong.textContent = option.displayId + ". ";
    label.append(input, strong, document.createTextNode(option.text));
    options.appendChild(label);
  });

  result.style.display = "none";
  result.innerHTML = "";

  if (savedAnswer && savedAnswer.answered) restoreAnsweredState(q, savedAnswer);
  else {
    checkBtn.style.display = "block";
    checkBtn.disabled = false;
    nextBtn.style.display = "none";
  }
  saveState();
}

function restoreAnsweredState(q, savedAnswer) {
  const correct = [...q.correctAnswers].sort();
  const selected = [...savedAnswer.selected].sort();
  document.querySelectorAll('input[name="answer"]').forEach(x => x.disabled = true);
  document.querySelectorAll("#options label").forEach(label => {
    const originalId = label.dataset.originalId;
    if (correct.includes(originalId)) label.classList.add("correct-answer");
    else if (selected.includes(originalId)) label.classList.add("wrong-answer");
  });
  renderResult(q, Boolean(savedAnswer.isCorrect));
  score.textContent = `Score: ${correctCount} / ${currentIndex + 1}`;
  checkBtn.style.display = "none";
  nextBtn.style.display = "block";
  nextBtn.textContent = currentIndex + 1 === examQuestions.length ? "Finish exam" : "Next question";
}

function renderResult(q, isCorrect) {
  const answerText = getDisplayOptions(q)
    .filter(option => q.correctAnswers.includes(option.originalId))
    .sort((a, b) => a.displayId.localeCompare(b.displayId))
    .map(option => `${option.displayId}. ${option.text}`)
    .join("<br>");
  const explanation = q.answerExplanation?.trim() || "No explanation available.";
  result.style.display = "block";
  result.innerHTML = `<div class="result-title">${isCorrect ? "✓ Correct" : "✗ Incorrect"}</div>
    <div><strong>Correct answer:</strong><br>${answerText}</div>
    <div class="explanation"><strong>Explanation:</strong><br>${explanation}</div>`;
}

function checkAnswerNow() {
  const q = examQuestions[currentIndex];
  const selected = [...document.querySelectorAll('input[name="answer"]:checked')].map(x => x.value).sort();
  if (!selected.length) { alert("Select an answer first."); return; }
  const correct = [...q.correctAnswers].sort();
  const isCorrect = selected.length === correct.length && selected.every((v, i) => v === correct[i]);
  if (isCorrect) correctCount++;
  answers[q.id] = { selected, isCorrect, answered: true };
  saveState();
  restoreAnsweredState(q, answers[q.id]);
}

function nextQuestionNow() {
  const q = examQuestions[currentIndex];
  if (!answers[q.id]?.answered) return;
  currentIndex++;
  saveState();
  currentIndex >= examQuestions.length ? showFinalScore() : showQuestion();
}

function showFinalScore() {
  const percent = Math.round((correctCount / examQuestions.length) * 100);
  progress.textContent = "Exam complete";
  score.textContent = "";
  examCard.className = "card final";
  examCard.innerHTML = `<h1>${correctCount} / ${examQuestions.length}</h1>
    <p>Your score: <strong>${percent}%</strong></p>
    <p class="meta">Seen overall: ${askedHistory.size} / ${EXAM.questionCount} questions</p>
    <button id="newExamBtn">Start new 150-question exam</button>
    <div class="meta" style="margin-top:12px">Exam ID: ${examId}</div>`;
  currentIndex = examQuestions.length;
  saveState();
  document.getElementById("newExamBtn").onclick = startNewExam;
}

function startNewExam() {
  examId = makeExamId();
  questionIds = generateQuestionIds();
  currentIndex = 0;
  correctCount = 0;
  answers = {};
  writeJson(ACTIVE_EXAM_KEY, { examId, questionIds });
  updateUrl();
  saveState();
  location.reload();
}

checkBtn.onclick = checkAnswerNow;
nextBtn.onclick = nextQuestionNow;
loadExam();
</script>
