rs can transform or enrich events, metadata adds contextual fields, and regular expressions can extract or modify information. Encryption protects data but is not itself a log-enrichment technique."},{"id":123,"question":"You can use Datadog APIs to automate log management tasks.","type":"single_choice","options":[{"id":"A","text":"True"},{"id":"B","text":"False"}],"correctAnswers":["A"],"answerExplanation":"The statement is true. Datadog APIs can be called from scripts or automation to create, update, retrieve, or manage supported log-management resources and workflows."},{"id":124,"question":"Which of the following are benefits of using notebooks for log analysis in Datadog ? (Choose 3 answers)","type":"multiple_choice","options":[{"id":"A","text":"Interactive exploration of log data"},{"id":"B","text":"Integration with third-party analytics tools"},{"id":"C","text":"Collaboration and sharing of analysis workflows"},{"id":"D","text":"Ability to create custom visualizations"}],"correctAnswers":["A","C","D"],"answerExplanation":"Notebooks support interactive exploration, custom visualizations, and shared analysis workflows. They are useful for documenting an investigation and collaborating on the same telemetry context."},{"id":125,"question":"Facets in the Log Explorer are used to create custom views for log analysis.","type":"single_choice","options":[{"id":"A","text":"False"},{"id":"B","text":"True"}],"correctAnswers":["B"],"answerExplanation":"The statement is true in the exam's framing. Facets let users organize and filter important log attributes, which can be combined into reusable analytical views in Log Explorer."},{"id":126,"question":"What is the role of the datadog.yaml file in log management ?","type":"single_choice","options":[{"id":"A","text":"To store user passwords"},{"id":"B","text":"To send notifications"},{"id":"C","text":"To design dashboards"},{"id":"D","text":"To configure log sources and agent settings"}],"correctAnswers":["D"],"answerExplanation":"The datadog.yaml file contains core Datadog Agent configuration. It controls Agent behavior and can participate in configuring how telemetry, including logs, is collected."},{"id":127,"question":"Which of the following are benefits of using structured logging ? (Choose 3 answers)","type":"multiple_choice","options":[{"id":"A","text":"Facilitates easier search and filtering"},{"id":"B","text":"Enhances readability of log data"},{"id":"C","text":"Allows for easier integration with third-party tools"},{"id":"D","text":"Enables better correlation of log events"}],"correctAnswers":["A","B","D"],"answerExplanation":"Structured logs have consistent fields that improve readability, searching, filtering, and correlation between events. Those predictable attributes make analysis easier across large datasets."},{"id":128,"question":"Describe how to create a log-based monitor.","type":"single_choice","options":[{"id":"A","text":"By disabling log collection"},{"id":"B","text":"By changing the desktop wallpaper"},{"id":"C","text":"By using a text editor"},{"id":"D","text":"By defining conditions in the Datadog UI"}],"correctAnswers":["D"],"answerExplanation":"A log-based monitor is created in the Datadog UI by defining the log query, evaluation condition, threshold, time window, and notification behavior."},{"id":129,"question":"How can you create a custom view in the Log Explorer ?","type":"single_choice","options":[{"id":"A","text":"By setting filters and saving the view in the Datadog UI"},{"id":"B","text":"By modifying system files"},{"id":"C","text":"By updating the operating system"},{"id":"D","text":"By using external software"}],"correctAnswers":["A"],"answerExplanation":"A custom Log Explorer view is built by applying the desired search query, filters, columns, and related presentation settings and then saving that configuration for reuse."},{"id":130,"question":"Log-based metrics in Datadog allow you to monitor business-specific KPIs derived from log data.","type":"single_choice","options":[{"id":"A","text":"True"},{"id":"B","text":"False"}],"correctAnswers":["A"],"answerExplanation":"The statement is true. Business events recorded in logs can be converted into metrics, allowing KPIs such as transactions, signups, failures, or other domain-specific counts to be monitored over time."},{"id":131,"question":"Explain the concept of log parsing in Datadog.","type":"single_choice","options":[{"id":"A","text":"Encrypting log data"},{"id":"B","text":"Rearranging log files"},{"id":"C","text":"Extracting structured data from unstructured log entries"},{"id":"D","text":"Creating new user interfaces"}],"correctAnswers":["C"],"answerExplanation":"Log parsing takes raw or semi-structured messages and extracts meaningful fields into structured attributes. This is what makes values inside a free-form line independently searchable and aggregatable."},{"id":132,"question":"What is the primary purpose of log management in Datadog ?","type":"single_choice","options":[{"id":"A","text":"Log analysis and monitoring"},{"id":"B","text":"Performance monitoring"},{"id":"C","text":"User management"},{"id":"D","text":"Data storage"}],"correctAnswers":["A"],"answerExplanation":"Log management centers on collecting, searching, analyzing, monitoring, and retaining log events. Storage is part of the system, but analysis and operational monitoring are the primary purpose in this question."},{"id":133,"question":"Log archives in Datadog are not encrypted for security reasons.","type":"single_choice","options":[{"id":"A","text":"True"},{"id":"B","text":"False"}],"correctAnswers":["B"],"answerExplanation":"The statement is false. Archived log data should be protected using the security controls of the configured archive destination, including encryption where supported and required."},{"id":134,"question":"How do you set up structured logging in Datadog ?","type":"single_choice","options":[{"id":"A","text":"By configuring log formats and sources to produce structured data"},{"id":"B","text":"By using text editors"},{"id":"C","text":"By disabling log collection"},{"id":"D","text":"By changing the desktop wallpaper"}],"correctAnswers":["A"],"answerExplanation":"Structured logging is produced by configuring applications or log sources to emit predictable fields, often in formats such as JSON. Datadog can then recognize and work with those fields directly."},{"id":135,"question":"In Datadog, what is a measure used for ? (Choose 2 answers)","type":"multiple_choice","options":[{"id":"A","text":"To define thresholds for log alerts"},{"id":"B","text":"To monitor the volume of logs"},{"id":"C","text":"To create custom log-based metrics"},{"id":"D","text":"To visualize log data in dashboards"}],"correctAnswers":["C","D"],"answerExplanation":"A measure represents a numeric log attribute that can be used quantitatively in analysis. Numeric values can contribute to derived metrics and visualizations rather than being treated only as text."},{"id":136,"question":"Which language is primarily used for writing Datadog log queries ?","type":"single_choice","options":[{"id":"A","text":"Lucene Query Language"},{"id":"B","text":"Python"},{"id":"C","text":"KQL (Kusto Query Language)"},{"id":"D","text":"SQL"}],"correctAnswers":["A"],"answerExplanation":"The exam expects Lucene Query Language because Datadog log search syntax follows Lucene-style query concepts for matching attributes, tags, ranges, and text."},{"id":137,"question":"What are the benefits of using structured logging ?","type":"single_choice","options":[{"id":"A","text":"Increases the complexity of log data"},{"id":"B","text":"Improves network speed"},{"id":"C","text":"Makes it easier to search, filter, and analyze log data"},{"id":"D","text":"Reduces log file sizes"}],"correctAnswers":["C"],"answerExplanation":"Structured logging makes fields explicit and consistent, which makes log data substantially easier to search, filter, group, and analyze. It does not inherently improve network speed or guarantee smaller files."},{"id":138,"question":"What is the function of the Datadog Log Explorer ?","type":"single_choice","options":[{"id":"A","text":"To configure hardware settings"},{"id":"B","text":"To search, filter, and analyze log data"},{"id":"C","text":"To play multimedia files"},{"id":"D","text":"To browse the internet"}],"correctAnswers":["B"],"answerExplanation":"Log Explorer is Datadog's interface for searching, filtering, viewing, and analyzing log events. It provides the investigation workflow for querying log data."},{"id":139,"question":"Which of the following integrations are supported by Datadog for log management ? (Choose 3 answers)","type":"multiple_choice","options":[{"id":"A","text":"MongoDB Atlas"},{"id":"B","text":"AWS CloudTrail"},{"id":"C","text":"Google Cloud Logging"},{"id":"D","text":"Azure Monitor"}],"correctAnswers":["A","C","D"],"answerExplanation":"The exam identifies MongoDB Atlas, Google Cloud Logging, and Azure Monitor as supported integrations for log-management use cases. These integrations can send or expose relevant telemetry to Datadog."},{"id":140,"question":"What is the purpose of log processing in Datadog ?","type":"single_choice","options":[{"id":"A","text":"To create user accounts"},{"id":"B","text":"To generate random data"},{"id":"C","text":"To transform, enrich, and filter log data"},{"id":"D","text":"To delete old logs"}],"correctAnswers":["C"],"answerExplanation":"Log processing transforms raw incoming events into useful, normalized data by parsing fields, enriching context, remapping attributes, and filtering unwanted events."},{"id":141,"question":"Describe the steps to create a custom log pipeline.","type":"single_choice","options":[{"id":"A","text":"By configuring email settings"},{"id":"B","text":"By writing SQL queries"},{"id":"C","text":"By updating the operating system"},{"id":"D","text":"By setting up pipeline rules and processors in the Datadog UI"}],"correctAnswers":["D"],"answerExplanation":"A custom pipeline is created by defining pipeline filters and adding processors in the Datadog UI. Each processor performs a specific transformation, parsing, remapping, or enrichment step."},{"id":142,"question":"What is the function of log rehydration in Datadog ?","type":"single_choice","options":[{"id":"A","text":"To convert logs into metrics"},{"id":"B","text":"To compress log data"},{"id":"C","text":"To restore archived logs for analysis"},{"id":"D","text":"To delete old logs"}],"correctAnswers":["C"],"answerExplanation":"Log rehydration restores archived events into Datadog so they can be searched and analyzed again. It is intended for historical data that is no longer in normal indexed retention."},{"id":143,"question":"How do you use processors to enrich log data in Datadog ?","type":"single_choice","options":[{"id":"A","text":"By editing HTML files"},{"id":"B","text":"By using social media"},{"id":"C","text":"By adding processors in the log pipeline"},{"id":"D","text":"By configuring Bluetooth settings"}],"correctAnswers":["C"],"answerExplanation":"Processors are added to log pipelines to enrich or transform events. They can add metadata, parse content, remap fields, or derive new attributes before indexing."},{"id":144,"question":"Describe how to create a new measure in Datadog.","type":"single_choice","options":[{"id":"A","text":"By using a text editor"},{"id":"B","text":"By disabling log collection"},{"id":"C","text":"By changing the desktop wallpaper"},{"id":"D","text":"By defining a numeric field in the log processing pipeline"}],"correctAnswers":["D"],"answerExplanation":"A measure is based on a numeric log attribute. Defining the numeric field as a measure allows quantitative aggregation and visualization of that value in log analytics."},{"id":145,"question":"Grok parsers in Datadog are used to encrypt log data.","type":"single_choice","options":[{"id":"A","text":"True"},{"id":"B","text":"False"}],"correctAnswers":["B"],"answerExplanation":"The statement is false. Grok parsers are for extracting structured fields from text patterns; they do not encrypt log content."},{"id":146,"question":"What are measures, and how are they used in log management ?","type":"single_choice","options":[{"id":"A","text":"Audio settings"},{"id":"B","text":"Colors used in the UI"},{"id":"C","text":"Numeric values extracted from logs for monitoring and alerting"},{"id":"D","text":"Physical dimensions"}],"correctAnswers":["C"],"answerExplanation":"Measures represent numeric values extracted from log attributes so users can aggregate, graph, monitor, and potentially alert on quantitative information contained in logs."},{"id":147,"question":"What is a log pipeline in Datadog ?","type":"single_choice","options":[{"id":"A","text":"A method for encrypting logs"},{"id":"B","text":"A sequence of steps to process and filter logs"},{"id":"C","text":"A backup mechanism"},{"id":"D","text":"A water transport system"}],"correctAnswers":["B"],"answerExplanation":"A log pipeline is an ordered sequence of processing steps applied to matching log events. It can parse, transform, enrich, normalize, or filter logs before indexing."},{"id":148,"question":"Which integrations can Datadog use to collect logs ? (Choose the answers you think are correct)","type":"multiple_choice","options":[{"id":"A","text":"Docker"},{"id":"B","text":"Fluentd"},{"id":"C","text":"Elasticsearch"},{"id":"D","text":"AWS CloudWatch"}],"correctAnswers":["A","B","C","D"],"answerExplanation":"The exam treats Docker, Fluentd, Elasticsearch, and AWS CloudWatch as integrations or sources that can participate in collecting or forwarding logs to Datadog."},{"id":149,"question":"What are common processors used in log processing pipelines ? (Choose 2 answers)","type":"multiple_choice","options":[{"id":"A","text":"Rename"},{"id":"B","text":"Grok"},{"id":"C","text":"Tag"},{"id":"D","text":"JSON Parser"}],"correctAnswers":["A","B","D"],"answerExplanation":"Rename, Grok, and JSON Parser are all log processors used to transform fields or parse content. Note that the question says choose two, but the supplied answer contains three choices; this explanation follows the supplied answer."},{"id":150,"question":"How do you configure log sources in Datadog ?","type":"single_choice","options":[{"id":"A","text":"By creating a new email address"},{"id":"B","text":"By modifying the datadog.yaml file"},{"id":"C","text":"By using a mobile app"},{"id":"D","text":"By using SQL queries"}],"correctAnswers":["B"],"answerExplanation":"Agent log sources are configured in Datadog Agent configuration, typically through integration-specific YAML configuration. The exam summarizes this as modifying the Datadog YAML configuration."},{"id":151,"question":"Which integrations are commonly used for shipping logs to Datadog from cloud platforms ? (Choose 4 answers)","type":"multiple_choice","options":[{"id":"A","text":"AWS CloudWatch Logs"},{"id":"B","text":"Azure Monitor Logs"},{"id":"C","text":"Google Cloud Logging"},{"id":"D","text":"Heroku Logplex"},{"id":"E","text":"IBM Cloud Logging"}],"correctAnswers":["A","B","C","D"],"answerExplanation":"AWS CloudWatch Logs, Azure Monitor Logs, Google Cloud Logging, and Heroku Logplex are established cloud or platform log-forwarding paths that can integrate with Datadog."},{"id":152,"question":"How can you monitor log volume and set limits in Datadog ?","type":"single_choice","options":[{"id":"A","text":"By using spreadsheet software"},{"id":"B","text":"By disabling log collection"},{"id":"C","text":"By changing network settings"},{"id":"D","text":"By using the log volume monitoring features and setting limits in the Datadog UI"}],"correctAnswers":["D"],"answerExplanation":"Datadog's log-management interface provides visibility into ingestion volume and configuration controls for managing or limiting how much data is processed. This is preferable to manipulating unrelated system settings."},{"id":153,"question":"What is the role of the Log Processing Pipeline in Datadog ?","type":"single_choice","options":[{"id":"A","text":"To transform and enrich log data"},{"id":"B","text":"To manage databases"},{"id":"C","text":"To monitor user activity"},{"id":"D","text":"To update software"}],"correctAnswers":["A"],"answerExplanation":"A Log Processing Pipeline transforms and enriches incoming events before indexing. This includes parsing, remapping fields, adding context, and applying other processors."},{"id":154,"question":"How can you create a log analytics dashboard in Datadog ?","type":"single_choice","options":[{"id":"A","text":"By using the dashboard creation tools in the Datadog UI"},{"id":"B","text":"By disabling log collection"},{"id":"C","text":"By using spreadsheet software"},{"id":"D","text":"By changing the screen resolution"}],"correctAnswers":["A"],"answerExplanation":"Log analytics dashboards are created using Datadog's dashboard tools, where widgets can visualize log queries, counts, trends, and related telemetry."},{"id":155,"question":"Describe how to visualize log data using Datadog dashboards.","type":"single_choice","options":[{"id":"A","text":"By configuring hardware settings"},{"id":"B","text":"By changing desktop wallpaper"},{"id":"C","text":"By creating custom widgets and dashboards in the Datadog UI"},{"id":"D","text":"By playing multimedia files"}],"correctAnswers":["C"],"answerExplanation":"Dashboards visualize logs by adding widgets that query or aggregate log data. Multiple widgets can combine different log views and other telemetry into a single operational display."},{"id":156,"question":"Which integrations can Datadog use to collect logs ? (Choose 4 answers)","type":"multiple_choice","options":[{"id":"A","text":"Elasticsearch"},{"id":"B","text":"Apache Kafka"},{"id":"C","text":"AWS CloudWatch"},{"id":"D","text":"Fluentd"},{"id":"E","text":"Docker"}],"correctAnswers":["A","C","D","E"],"answerExplanation":"The supplied answer identifies Elasticsearch, AWS CloudWatch, Fluentd, and Docker as supported log collection sources or integrations. Apache Kafka is not selected in this question."},{"id":157,"question":"Which feature allows you to visualize log data in Datadog ?","type":"single_choice","options":[{"id":"A","text":"Log Explorer"},{"id":"B","text":"User Manager"},{"id":"C","text":"Configuration Manager"},{"id":"D","text":"Network Monitor"}],"correctAnswers":["A"],"answerExplanation":"Log Explorer is the main Datadog feature for visualizing, searching, and analyzing log events and their distribution over time."},{"id":158,"question":"What are the best practices for log retention and archiving ?","type":"single_choice","options":[{"id":"A","text":"Deleting all logs after a week"},{"id":"B","text":"Setting appropriate retention periods and using secure storage for archives"},{"id":"C","text":"Changing desktop wallpaper frequently"},{"id":"D","text":"Disabling log collection"}],"correctAnswers":["B"],"answerExplanation":"Good retention practice means keeping data for an appropriate period and storing long-term archives securely. Retention should reflect operational, legal, and cost requirements rather than an arbitrary fixed deletion schedule."},{"id":159,"question":"Describe the use of machine learning in log analysis with Datadog.","type":"single_choice","options":[{"id":"A","text":"By changing the screen resolution"},{"id":"B","text":"By leveraging machine learning algorithms to identify patterns and anomalies in log data"},{"id":"C","text":"By playing multimedia files"},{"id":"D","text":"By using spreadsheet software"}],"correctAnswers":["B"],"answerExplanation":"Machine learning can identify recurring patterns and detect anomalous behavior that differs from a learned baseline. This helps surface unusual log activity without relying only on fixed thresholds."},{"id":160,"question":"What are the recommended best practices for log retention and archiving in Datadog ? (Choose 3 answers)","type":"multiple_choice","options":[{"id":"A","text":"Regularly delete logs older than 30 days"},{"id":"B","text":"Monitor archive storage usage and performance"},{"id":"C","text":"Encrypt archived logs for security"},{"id":"D","text":"Implement strict access controls for archived logs"},{"id":"E","text":"Avoid using log retention altogether"}],"correctAnswers":["B","C","D"],"answerExplanation":"Archive storage should be monitored, archived data should be encrypted, and access should be tightly controlled. These practices protect long-lived data while keeping archival operations manageable."},{"id":161,"question":"What is the primary purpose of the Datadog Agent ?","type":"single_choice","options":[{"id":"A","text":"To collect and send metrics and logs to Datadog"},{"id":"B","text":"To monitor network speed"},{"id":"C","text":"To change desktop wallpaper"},{"id":"D","text":"To manage user access"}],"correctAnswers":["A"],"answerExplanation":"The Datadog Agent collects telemetry such as metrics and logs from the host or runtime and sends that data to Datadog for centralized monitoring and analysis."},{"id":162,"question":"How do you troubleshoot missing logs in Datadog ?","type":"single_choice","options":[{"id":"A","text":"By checking agent status, configuration, and network connectivity"},{"id":"B","text":"By updating the operating system"},{"id":"C","text":"By changing the screen resolution"},{"id":"D","text":"By managing user access"}],"correctAnswers":["A"],"answerExplanation":"Missing logs are commonly caused by an unhealthy Agent, incorrect collection configuration, or connectivity problems. Checking these three areas isolates most ingestion failures quickly."},{"id":163,"question":"What is the purpose of the Datadog Audit Trail feature ?","type":"single_choice","options":[{"id":"A","text":"To track changes and actions taken within Datadog"},{"id":"B","text":"To play multimedia files"},{"id":"C","text":"To configure hardware settings"},{"id":"D","text":"To change desktop wallpaper"}],"correctAnswers":["A"],"answerExplanation":"Audit Trail records administrative and user actions within Datadog, providing visibility into configuration changes and other important activity for security and governance."},{"id":164,"question":"Structured logging makes it harder to search, filter, and analyze log data.","type":"single_choice","options":[{"id":"A","text":"True"},{"id":"B","text":"False"}],"correctAnswers":["B"],"answerExplanation":"The statement is false. Structured logging makes fields explicit, which generally makes logs easier rather than harder to search, filter, correlate, and analyze."},{"id":165,"question":"Datadog can only collect logs from local files and cannot integrate with other platforms.","type":"single_choice","options":[{"id":"A","text":"False"},{"id":"B","text":"True"}],"correctAnswers":["A"],"answerExplanation":"The statement is false. Datadog integrates with many cloud providers, services, containers, agents, and forwarding tools, so log collection is not limited to local files."},{"id":166,"question":"How do you enable log collection from Docker containers in Datadog ?","type":"single_choice","options":[{"id":"A","text":"By changing the screen resolution"},{"id":"B","text":"By updating the operating system"},{"id":"C","text":"By configuring network settings"},{"id":"D","text":"By setting up the Datadog Agent to collect Docker logs"}],"correctAnswers":["D"],"answerExplanation":"Docker log collection is enabled by deploying and configuring the Datadog Agent with container-log collection enabled so it can discover and forward container output."},{"id":167,"question":"Anomaly detection in log data involves identifying normal patterns and deviations.","type":"single_choice","options":[{"id":"A","text":"True"},{"id":"B","text":"False"}],"correctAnswers":["A"],"answerExplanation":"The statement is true. Anomaly detection first establishes or models expected behavior and then identifies significant deviations from that baseline."},{"id":168,"question":"The datadog.yaml file is used to configure log sources and agent settings.","type":"single_choice","options":[{"id":"A","text":"True"},{"id":"B","text":"False"}],"correctAnswers":["A"],"answerExplanation":"The statement is true in the exam's framing. Datadog Agent configuration files, including datadog.yaml and integration-specific YAML files, define Agent behavior and log collection settings."},{"id":169,"question":"Explain the concept of log anomaly detection in Datadog.","type":"single_choice","options":[{"id":"A","text":"Increasing network speed"},{"id":"B","text":"Reducing system performance"},{"id":"C","text":"Identifying unusual patterns or deviations in log data"},{"id":"D","text":"A method to play multimedia files"}],"correctAnswers":["C"],"answerExplanation":"Log anomaly detection searches for patterns or behavior that differ significantly from what is normally observed. These deviations can indicate failures, attacks, or unexpected application behavior."},{"id":170,"question":"What are the benefits of using notebooks in Datadog ? (Choose 3 answers)","type":"multiple_choice","options":[{"id":"A","text":"Provides a platform for writing and executing Python code"},{"id":"B","text":"Enhances log data encryption"},{"id":"C","text":"Allows for interactive log analysis"},{"id":"D","text":"Facilitates collaboration among team members"},{"id":"E","text":"Enables the creation of custom log processing pipelines"}],"correctAnswers":["A","C","D"],"answerExplanation":"The supplied answer highlights notebooks as collaborative, interactive analysis tools and also mentions writing or executing Python code. The key idea is that notebooks provide a shared workspace for exploring telemetry and communicating findings."},{"id":171,"question":"How do you set up an integration with AWS CloudWatch Logs ?","type":"single_choice","options":[{"id":"A","text":"By changing the screen resolution"},{"id":"B","text":"By using spreadsheet software"},{"id":"C","text":"By configuring the integration in the Datadog UI and AWS console"},{"id":"D","text":"By disabling log collection"}],"correctAnswers":["C"],"answerExplanation":"AWS CloudWatch Logs integration requires configuration on both sides: Datadog must be authorized to access the relevant AWS account or forwarding path, and AWS must be configured to send or expose the selected logs."},{"id":172,"question":"Which tool in Datadog allows you to create custom log-based metrics ?","type":"single_choice","options":[{"id":"A","text":"Trace Explorer"},{"id":"B","text":"Log Explorer"},{"id":"C","text":"Log Configuration Manager"},{"id":"D","text":"Metric Generator"}],"correctAnswers":["B"],"answerExplanation":"Log Explorer is where users define searches and derive metrics from matching log events or attributes, making it the relevant interface for creating log-based metrics in this question."},{"id":173,"question":"Describe the integration of Datadog with third-party log management tools.","type":"single_choice","options":[{"id":"A","text":"By changing desktop wallpaper"},{"id":"B","text":"By using integrations and APIs provided by Datadog"},{"id":"C","text":"By configuring hardware settings"},{"id":"D","text":"By playing multimedia files"}],"correctAnswers":["B"],"answerExplanation":"Datadog connects with third-party logging systems through supported integrations and APIs. These mechanisms allow telemetry to be exchanged without changing unrelated workstation or hardware settings."},{"id":174,"question":"Log throttling controls the rate of log ingestion to prevent overloading the system.","type":"single_choice","options":[{"id":"A","text":"False"},{"id":"B","text":"True"}],"correctAnswers":["B"],"answerExplanation":"The statement is true. Throttling limits the rate at which log events are accepted or processed, helping protect downstream systems from excessive volume."},{"id":175,"question":"How can you ensure compliance with log retention regulations using Datadog ?","type":"single_choice","options":[{"id":"A","text":"By changing the screen resolution"},{"id":"B","text":"By disabling log collection"},{"id":"C","text":"By ignoring regulations"},{"id":"D","text":"By setting up proper retention policies and archives"}],"correctAnswers":["D"],"answerExplanation":"Compliance requires retention behavior that matches applicable rules. Configuring suitable retention periods and secure archives helps preserve required data for the mandated duration."},{"id":176,"question":"Explain the process of integrating Datadog with Kubernetes for log management.","type":"single_choice","options":[{"id":"A","text":"By playing multimedia files"},{"id":"B","text":"By deploying the Datadog Agent as a DaemonSet in Kubernetes"},{"id":"C","text":"By changing desktop wallpaper"},{"id":"D","text":"By configuring hardware settings"}],"correctAnswers":["B"],"answerExplanation":"A common Kubernetes deployment runs the Datadog Agent as a DaemonSet, placing an Agent pod on each node so node and container telemetry can be collected consistently across the cluster."},{"id":177,"question":"Explain the process of setting up role-based access control (RBAC) for log management in Datadog.","type":"single_choice","options":[{"id":"A","text":"By using spreadsheet software"},{"id":"B","text":"By playing multimedia files"},{"id":"C","text":"By changing the desktop wallpaper"},{"id":"D","text":"By defining roles and permissions for users and teams in the Datadog UI"}],"correctAnswers":["D"],"answerExplanation":"RBAC is configured by creating roles and assigning permissions to users or teams. This limits log-management actions and data access according to each group's responsibilities."},{"id":178,"question":"Log management in Datadog primarily focuses on performance monitoring.","type":"single_choice","options":[{"id":"A","text":"True"},{"id":"B","text":"False"}],"correctAnswers":["B"],"answerExplanation":"The statement is false. Log management focuses on collecting, processing, searching, analyzing, monitoring, and retaining log events; performance monitoring is broader and includes metrics, traces, and other telemetry."},{"id":179,"question":"Which features are provided by the Datadog Audit Trail ? (Choose 2 answers)","type":"multiple_choice","options":[{"id":"A","text":"Monitors log ingestion rates"},{"id":"B","text":"Records user activity within Datadog"},{"id":"C","text":"Alerts on anomalies in log data"},{"id":"D","text":"Encrypts log data"},{"id":"E","text":"Tracks changes made to log pipelines"}],"correctAnswers":["B","E"],"answerExplanation":"Audit Trail records user activity and configuration changes, including changes to resources such as log pipelines. It does not itself encrypt logs or act as an ingestion-rate monitor."},{"id":180,"question":"What is the role of the Datadog Agent Manager in log management ?","type":"single_choice","options":[{"id":"A","text":"To design user interfaces"},{"id":"B","text":"To manage and monitor Datadog agents"},{"id":"C","text":"To configure hardware settings"},{"id":"D","text":"To play multimedia files"}],"correctAnswers":["B"],"answerExplanation":"In the exam's terminology, Agent Manager is used to oversee the state and management of Datadog Agents rather than to manipulate application UI or host hardware."},{"id":181,"question":"How do you share log analytics insights with your team in Datadog ?","type":"single_choice","options":[{"id":"A","text":"By sharing notebooks, dashboards, and alerts in the Datadog UI"},{"id":"B","text":"By using spreadsheet software"},{"id":"C","text":"By disabling log collection"},{"id":"D","text":"By changing the screen resolution"}],"correctAnswers":["A"],"answerExplanation":"Notebooks, dashboards, and alerts are all shareable ways to communicate observability findings. They let team members view the same evidence, visualizations, and monitoring context inside Datadog."},{"id":182,"question":"What type of log data does the Grok parser handle ?","type":"single_choice","options":[{"id":"A","text":"Unstructured log data"},{"id":"B","text":"Encrypted data"},{"id":"C","text":"Binary data"},{"id":"D","text":"Image files"}],"correctAnswers":["A"],"answerExplanation":"Grok is designed for unstructured or semi-structured text logs. It matches patterns in the raw message and extracts named fields from those matches."},{"id":183,"question":"What are the common issues faced during log collection, and how can they be resolved No network connection ?","type":"single_choice","options":[{"id":"A","text":"No network connection"},{"id":"B","text":"Incorrect screen resolution"},{"id":"C","text":"Misconfigured agents, network issues, insufficient permissions"},{"id":"D","text":"Old hardware"}],"correctAnswers":["C"],"answerExplanation":"Misconfigured Agents, network failures, and insufficient permissions are common reasons logs fail to arrive. Checking configuration, connectivity, and file or service access addresses the main collection path."},{"id":184,"question":"Log parsing in Datadog involves extracting structured data from unstructured log entries.","type":"single_choice","options":[{"id":"A","text":"True"},{"id":"B","text":"False"}],"correctAnswers":["A"],"answerExplanation":"The statement is true. Parsing identifies meaningful pieces of a raw log message and stores them as structured attributes for querying and analysis."},{"id":185,"question":"What are the benefits of using structured logging ? (Choose 4 answers)","type":"multiple_choice","options":[{"id":"A","text":"Enables better correlation of log events"},{"id":"B","text":"Facilitates easier search and filtering"},{"id":"C","text":"Allows for easier integration with third-party tools"},{"id":"D","text":"Reduces log storage requirements"},{"id":"E","text":"Enhances readability of log data"}],"correctAnswers":["A","B","C","E"],"answerExplanation":"Structured logs improve readability, search and filtering, correlation between events, and interoperability with tools that understand consistent fields. They do not necessarily reduce storage requirements."},{"id":186,"question":"What are the benefits of using Datadog for container log management ?","type":"single_choice","options":[{"id":"A","text":"Increased complexity"},{"id":"B","text":"Comprehensive monitoring, centralized logging, and scalability"},{"id":"C","text":"Reduced log visibility"},{"id":"D","text":"Slower network speed"}],"correctAnswers":["B"],"answerExplanation":"Datadog centralizes container logs and correlates them with container and infrastructure telemetry. This provides broad visibility while scaling across dynamic container environments."},{"id":187,"question":"Describe how to configure Datadog to collect logs from Docker containers.","type":"single_choice","options":[{"id":"A","text":"By disabling log collection"},{"id":"B","text":"By changing desktop wallpaper"},{"id":"C","text":"By configuring the Datadog Agent to collect Docker logs"},{"id":"D","text":"By using spreadsheet software"}],"correctAnswers":["C"],"answerExplanation":"Docker collection requires configuring the Datadog Agent to discover or tail container logs and forward them to Datadog. No separate spreadsheet or desktop customization is involved."},{"id":188,"question":"Describe the use of API keys in securing log data.","type":"single_choice","options":[{"id":"A","text":"To encrypt multimedia files"},{"id":"B","text":"To change desktop wallpaper"},{"id":"C","text":"To disable log collection"},{"id":"D","text":"To authenticate and authorize API access to log data"}],"correctAnswers":["D"],"answerExplanation":"API keys identify and authenticate clients sending data or calling supported Datadog APIs. They help ensure that only authorized clients can submit or access operations permitted by the API."},{"id":189,"question":"What is the purpose of log retention policies in Datadog ?","type":"single_choice","options":[{"id":"A","text":"To ensure compliance and long-term data analysis"},{"id":"B","text":"To change desktop wallpaper"},{"id":"C","text":"To manage user access"},{"id":"D","text":"To disable log collection"}],"correctAnswers":["A"],"answerExplanation":"Retention policies ensure logs remain available long enough for compliance, audits, investigations, and historical analysis before they are deleted or moved to archival storage."},{"id":190,"question":"Which Datadog feature helps you track changes and actions within the platform ?","type":"single_choice","options":[{"id":"A","text":"Network Monitor"},{"id":"B","text":"Log Explorer"},{"id":"C","text":"Audit Trail"},{"id":"D","text":"Configuration Manager"}],"correctAnswers":["C"],"answerExplanation":"Audit Trail is the Datadog feature designed to record and review significant changes and actions performed within the platform."},{"id":191,"question":"You can set up log retention policies and archives in Datadog to comply with regulations.","type":"single_choice","options":[{"id":"A","text":"False"},{"id":"B","text":"True"}],"correctAnswers":["B"],"answerExplanation":"The statement is true. Retention configuration and archives can be combined so organizations keep log data for the periods required by regulations or internal policies."},{"id":192,"question":"How do you troubleshoot missing logs in Datadog ?","type":"single_choice","options":[{"id":"A","text":"By changing desktop wallpaper"},{"id":"B","text":"By checking agent status, configuration, and network connectivity"},{"id":"C","text":"By ignoring the issue"},{"id":"D","text":"By disabling log collection"}],"correctAnswers":["B"],"answerExplanation":"The standard troubleshooting path is to verify that the Agent is healthy, confirm the log source is configured correctly, and ensure network connectivity to Datadog."},{"id":193,"question":"Describe the process of setting up log archives in Datadog.","type":"single_choice","options":[{"id":"A","text":"By configuring archive settings in the Datadog UI"},{"id":"B","text":"By using a text editor"},{"id":"C","text":"By changing desktop wallpaper"},{"id":"D","text":"By disabling log collection"}],"correctAnswers":["A"],"answerExplanation":"Log archives are set up by creating an archive configuration in Datadog and specifying the destination and relevant filtering or routing settings for the logs that should be stored."},{"id":194,"question":"Explain the concept of log rehydration in Datadog.","type":"single_choice","options":[{"id":"A","text":"A method to cool down servers"},{"id":"B","text":"A method to encrypt log data"},{"id":"C","text":"A technique to improve network speed"},{"id":"D","text":"A process to restore archived logs for analysis"}],"correctAnswers":["D"],"answerExplanation":"Rehydration is the process of taking archived historical logs and making them searchable in Datadog again for an investigation, audit, or other analysis."},{"id":195,"question":"How can you automate log management tasks using Datadog APIs ?","type":"single_choice","options":[{"id":"A","text":"By changing network settings"},{"id":"B","text":"By writing scripts that interact with Datadog APIs"},{"id":"C","text":"By using desktop applications"},{"id":"D","text":"By disabling log collection"}],"correctAnswers":["B"],"answerExplanation":"Datadog APIs can be called from scripts to automate repetitive log-management operations. This allows workflows to be integrated into CI/CD, administration tools, or scheduled jobs."},{"id":196,"question":"What are the benefits of using notebooks for log analysis in Datadog ?","type":"single_choice","options":[{"id":"A","text":"To change desktop wallpaper"},{"id":"B","text":"To play multimedia files"},{"id":"C","text":"To configure hardware settings"},{"id":"D","text":"To create interactive, customizable, and shareable log analysis workflows"}],"correctAnswers":["D"],"answerExplanation":"Notebooks provide a reusable workspace that combines queries, visualizations, and explanatory text. Because they can be shared, they are useful for collaborative and repeatable log investigations."},{"id":197,"question":"How can log collection be optimized for Kubernetes environments in Datadog ? (Choose 2 answers)","type":"multiple_choice","options":[{"id":"A","text":"Using Kubernetes labels for log enrichment"},{"id":"B","text":"Configuring node-specific log processors"},{"id":"C","text":"By deploying a dedicated logging pod in each namespace"},{"id":"D","text":"Increasing log retention duration for Kubernetes logs"},{"id":"E","text":"Utilizing fluentd as a log collector"}],"correctAnswers":["A","E"],"answerExplanation":"Kubernetes labels provide useful metadata that can enrich logs automatically, while Fluentd can be used as a collector or forwarding component in Kubernetes logging architectures. These approaches improve organization and collection at cluster scale."},{"id":198,"question":"What are the key security features available for log management in Datadog ?","type":"single_choice","options":[{"id":"A","text":"To change desktop wallpaper"},{"id":"B","text":"Encryption, access controls, and audit trails"},{"id":"C","text":"To play multimedia files"},{"id":"D","text":"To configure hardware settings"}],"correctAnswers":["B"],"answerExplanation":"Core log-management security controls include encryption, access control, and auditability. Together they protect data confidentiality, limit who can access it, and record important actions."},{"id":199,"question":"What is the role of the Datadog Agent in Kubernetes environments ?","type":"single_choice","options":[{"id":"A","text":"To configure hardware settings"},{"id":"B","text":"To change desktop wallpaper"},{"id":"C","text":"To play multimedia files"},{"id":"D","text":"To collect and forward metrics and logs to Datadog"}],"correctAnswers":["D"],"answerExplanation":"In Kubernetes, the Datadog Agent collects telemetry from nodes, pods, containers, and supported services and forwards that telemetry, including logs, to Datadog."},{"id":200,"question":"How do you ensure data privacy and security in Datadog log management ?","type":"single_choice","options":[{"id":"A","text":"By changing the screen resolution"},{"id":"B","text":"By using spreadsheet software"},{"id":"C","text":"By implementing encryption, access controls, and monitoring user activities"},{"id":"D","text":"By disabling log collection"}],"correctAnswers":["C"],"answerExplanation":"Encryption protects log data, access controls restrict who can view or manage it, and monitoring user activity provides accountability. Together these controls support privacy and security."},{"id":201,"question":"How can you use the Audit Trail to track changes in log configurations ?","type":"single_choice","options":[{"id":"A","text":"By using spreadsheet software"},{"id":"B","text":"By disabling log collection"},{"id":"C","text":"By reviewing logs in the Audit Trail section of Datadog"},{"id":"D","text":"By changing the screen resolution"}],"correctAnswers":["C"],"answerExplanation":"Audit Trail records relevant configuration and user actions. Reviewing the Audit Trail allows administrators to see changes to log-related configuration and identify who performed them."},{"id":202,"question":"Which are common processors used in Datadog's log processing pipeline ? (Choose 3 answers)","type":"multiple_choice","options":[{"id":"A","text":"JSON Parser"},{"id":"B","text":"XML Parser"},{"id":"C","text":"Tag"},{"id":"D","text":"Grok"},{"id":"E","text":"Rename"}],"correctAnswers":["A","D","E"],"answerExplanation":"JSON Parser, Grok, and Rename are common pipeline processors. They respectively parse JSON content, extract fields from text patterns, and rename attributes into the desired schema."},{"id":203,"question":"What is a primary benefit of using log facets in Datadog ?","type":"single_choice","options":[{"id":"A","text":"To categorize and filter log data"},{"id":"B","text":"To encrypt data"},{"id":"C","text":"To play multimedia files"},{"id":"D","text":"To manage hardware settings"}],"correctAnswers":["A"],"answerExplanation":"Facets promote important attributes f const EXAM_SIZE = 90;
const HISTORY_KEY = "datadog-exam-asked-v2";

let askedHistory = new Set(JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"));
let examQuestions = [];
let currentIndex = 0;
let correctCount = 0;
let answered = false;

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function startExam() {
  examQuestions = shuffle(EXAM.questions).slice(0, Math.min(EXAM_SIZE, EXAM.questions.length));
  currentIndex = 0;
  correctCount = 0;
  answered = false;
  showQuestion();
}

function showQuestion() {
  answered = false;

  const q = examQuestions[currentIndex];
  const wasAskedBefore = askedHistory.has(q.id);

  askedHistory.add(q.id);
  localStorage.setItem(HISTORY_KEY, JSON.stringify([...askedHistory]));

  document.getElementById("progress").textContent =
    `Question ${currentIndex + 1} / ${examQuestions.length}`;

  document.getElementById("score").textContent =
    `Score: ${correctCount} / ${currentIndex}`;

  document.getElementById("history").textContent =
    `${wasAskedBefore ? "Asked previously" : "New question"} · Seen overall: ${askedHistory.size} / ${EXAM.questionCount}`;

  document.getElementById("question").textContent = q.question;

  const inputType = q.type === "multiple_choice" ? "checkbox" : "radio";
  const options = document.getElementById("options");
  options.innerHTML = "";

  q.options.forEach(option => {
    const label = document.createElement("label");
    label.dataset.optionId = option.id;

    const input = document.createElement("input");
    input.type = inputType;
    input.name = "answer";
    input.value = option.id;

    const strong = document.createElement("strong");
    strong.textContent = option.id + ". ";

    label.appendChild(input);
    label.appendChild(strong);
    label.appendChild(document.createTextNode(option.text));
    options.appendChild(label);
  });

  const result = document.getElementById("result");
  result.style.display = "none";
  result.innerHTML = "";

  document.getElementById("checkBtn").style.display = "block";
  document.getElementById("checkBtn").disabled = false;
  document.getElementById("nextBtn").style.display = "none";
}

function checkAnswer() {
  if (answered) return;

  const q = examQuestions[currentIndex];
  const selected = [...document.querySelectorAll('input[name="answer"]:checked')]
    .map(el => el.value)
    .sort();

  if (selected.length === 0) {
    alert("Select an answer first.");
    return;
  }

  const correct = [...q.correctAnswers].sort();
  const isCorrect =
    selected.length === correct.length &&
    selected.every((value, i) => value === correct[i]);

  answered = true;

  if (isCorrect) correctCount++;

  document.querySelectorAll('input[name="answer"]').forEach(el => el.disabled = true);

  document.querySelectorAll("#options label").forEach(label => {
    const id = label.dataset.optionId;

    if (correct.includes(id)) {
      label.classList.add("correct-answer");
    } else if (selected.includes(id)) {
      label.classList.add("wrong-answer");
    }
  });

  const answerText = correct
    .map(id => {
      const option = q.options.find(o => o.id === id);
      return `${id}. ${option ? option.text : ""}`;
    })
    .join("<br>");

  const explanation = q.answerExplanation?.trim()
    ? q.answerExplanation
    : "No explanation available.";

  const result = document.getElementById("result");
  result.style.display = "block";
  result.innerHTML = `
    <div class="result-title">${isCorrect ? "✓ Correct" : "✗ Incorrect"}</div>
    <div><strong>Correct answer:</strong><br>${answerText}</div>
    <div class="explanation">
      <strong>Explanation:</strong><br>
      ${explanation}
    </div>
  `;

  document.getElementById("score").textContent =
    `Score: ${correctCount} / ${currentIndex + 1}`;

  document.getElementById("checkBtn").style.display = "none";
  document.getElementById("nextBtn").style.display = "block";
  document.getElementById("nextBtn").textContent =
    currentIndex + 1 === examQuestions.length ? "Finish exam" : "Next question";
}

function nextQuestion() {
  if (!answered) return;

  currentIndex++;

  if (currentIndex >= examQuestions.length) {
    showFinalScore();
    return;
  }

  showQuestion();
}

function showFinalScore() {
  const percent = Math.round((correctCount / examQuestions.length) * 100);

  document.getElementById("progress").textContent = "Exam complete";
  document.getElementById("score").textContent = "";

  const card = document.getElementById("examCard");
  card.className = "card final";
  card.innerHTML = `
    <h1>${correctCount} / ${examQuestions.length}</h1>
    <p>Your score: <strong>${percent}%</strong></p>
    <p class="meta">Seen overall: ${askedHistory.size} / ${EXAM.questionCount} questions</p>
    <button id="newExamBtn">Start new 90-question exam</button>
  `;

  document.getElementById("newExamBtn").onclick = () => location.reload();
}

document.getElementById("checkBtn").onclick = checkAnswer;
document.getElementById("nextBtn").onclick = nextQuestion;

startExam();
</script>
