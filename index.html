text":"Using webhooks"},{"id":"C","text":"Via email"},{"id":"D","text":"Using API integrations"},{"id":"E","text":"Through syslog forwarding"}],"correctAnswers":["B","D","E"]},{"id":59,"question":"What are common steps to troubleshoot missing logs in Datadog ? (Choose 3 answers)","type":"multiple_choice","options":[{"id":"A","text":"Restart the server"},{"id":"B","text":"Review log source configuration"},{"id":"C","text":"Check the Datadog Agent status"},{"id":"D","text":"Update log retention policies"},{"id":"E","text":"Verify network connectivity"}],"correctAnswers":["B","C","E"]},{"id":60,"question":"You can use Datadog’s Log Explorer to create custom dashboards that include log data.","type":"single_choice","options":[{"id":"A","text":"True"},{"id":"B","text":"False"}],"correctAnswers":["A"]},{"id":61,"question":"How does Datadog handle log data scalability, and what strategies can be employed to ensure efficient log collection and analysis in large-scale environments ?","type":"single_choice","options":[{"id":"A","text":"Datadog provides native integrations with big data platforms like Apache Kafka and Hadoop for storing and processing massive volumes of log data. Strategies to ensure efficiency in large-scale environments include using log partitioning and parallel processing."},{"id":"B","text":"Datadog uses a centralized log storage system with built-in redundancy and failover mechanisms to ensure high availability and scalability. Strategies to ensure efficiency in large-scale environments include using log sharding and optimizing query performance."},{"id":"C","text":"Datadog leverages cloud-native technologies such as auto-scaling and serverless computing to dynamically adjust resources based on demand. Strategies to ensure efficiency in large-scale environments include using log aggregation and pre-processing techniques."},{"id":"D","text":"Datadog employs a distributed architecture that scales horizontally to accommodate increasing log volumes. Strategies to ensure efficiency in large-scale environments include using log sampling and optimizing log processing pipelines."}],"correctAnswers":["D"]},{"id":62,"question":"Discuss the challenges associated with real-time log monitoring and how Datadog addresses them.","type":"single_choice","options":[{"id":"A","text":"Real-time log monitoring requires seamless integration with existing infrastructure and applications to capture and analyze log data effectively. Datadog addresses this challenge by offering a wide range of integrations with popular platforms and technologies, simplifying the deployment and configuration process."},{"id":"B","text":"Real-time log monitoring often involves dealing with noisy log data and false positives, which can overwhelm operators and lead to alert fatigue. Datadog mitigates this challenge by providing advanced filtering and aggregation capabilities, allowing users to focus on relevant log events and reduce noise."},{"id":"C","text":"Real-time log monitoring requires processing large volumes of log data quickly and accurately to detect and respond to events as they occur. Datadog addresses this challenge by employing scalable, distributed architectures that can handle high throughput and low latency log ingestion and analysis."},{"id":"D","text":"Real-time log monitoring necessitates robust security measures to protect sensitive log data from unauthorized access and ensure compliance with data privacy regulations. Datadog addresses this challenge by implementing encryption, access controls, and auditing features to safeguard log data and enforce compliance standards."}],"correctAnswers":["C"]},{"id":63,"question":"Datadog does not support the forwarding of logs to third-party storage solutions like Amazon S3.","type":"single_choice","options":[{"id":"A","text":"True"},{"id":"B","text":"False"}],"correctAnswers":["B"]},{"id":64,"question":"How can Datadog help ensure compliance with data retention policies ?","type":"single_choice","options":[{"id":"A","text":"By automatically deleting logs after a set period"},{"id":"B","text":"By preventing log ingestion"},{"id":"C","text":"By encrypting all logs"},{"id":"D","text":"By providing audit trails for log access"}],"correctAnswers":["A"]},{"id":65,"question":"What is the purpose of log sampling, and how does it impact log analysis in Datadog ?","type":"single_choice","options":[{"id":"A","text":"Log sampling is used to aggregate logs from multiple sources into a single stream, simplifying analysis. It impacts log analysis by reducing the diversity of log data."},{"id":"B","text":"Log sampling is used to reduce the volume of logs ingested by Datadog, improving performance and reducing costs. It can impact log analysis by potentially missing important log events."},{"id":"C","text":"Log sampling is used to ensure that only a representative subset of logs is analyzed, allowing for more efficient resource utilization. It impacts log analysis by providing less granular insights into system behavior."},{"id":"D","text":"Log sampling is used to prioritize certain types of logs over others, focusing analysis on critical events. It impacts log analysis by skewing results towards the sampled logs."}],"correctAnswers":["B"]},{"id":66,"question":"Datadog allows you to set up role-based access control (RBAC) to manage user permissions for viewing and managing logs.","type":"single_choice","options":[{"id":"A","text":"False"},{"id":"B","text":"True"}],"correctAnswers":["B"]},{"id":67,"question":"Which Datadog feature can be used to visualize log data alongside application performance metrics ?","type":"single_choice","options":[{"id":"A","text":"Network Monitor"},{"id":"B","text":"Dashboards"},{"id":"C","text":"Service Map"},{"id":"D","text":"Log Pipelines"}],"correctAnswers":["B"]},{"id":68,"question":"Discuss the potential challenges and solutions associated with managing log data security and compliance requirements in Datadog.","type":"single_choice","options":[ const STORAGE_KEY = "datadog-exam-asked-v1";
let asked = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
let queue = shuffle([...EXAM.questions]);
let index = 0;
let current = null;

function shuffle(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

function saveAsked() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...asked]));
}

function showQuestion() {
  if (index >= queue.length) {
    queue = shuffle([...EXAM.questions]);
    index = 0;
  }

  current = queue[index++];
  const wasAskedBefore = asked.has(current.id);

  document.getElementById("askedBefore").textContent =
    wasAskedBefore ? "Asked previously" : "New question";

  // A question counts as "asked" once it is shown.
  asked.add(current.id);
  saveAsked();

  document.getElementById("progress").textContent =
    `Question ${index} / ${queue.length}`;

  document.getElementById("history").textContent =
    `Seen ${asked.size} / ${EXAM.questionCount}`;

  document.getElementById("question").textContent =
    `${current.id}. ${current.question}`;

  const inputType = current.type === "multiple_choice" ? "checkbox" : "radio";
  const options = document.getElementById("options");
  options.innerHTML = "";

  current.options.forEach(option => {
    const label = document.createElement("label");
    label.innerHTML = `
      <input type="${inputType}" name="answer" value="${option.id}">
      <strong>${option.id}.</strong> ${escapeHtml(option.text)}
    `;
    options.appendChild(label);
  });

  const result = document.getElementById("result");
  result.style.display = "none";
  result.textContent = "";
}

function checkAnswer() {
  const selected = [...document.querySelectorAll('input[name="answer"]:checked')]
    .map(x => x.value)
    .sort();

  const correct = [...current.correctAnswers].sort();
  const ok = JSON.stringify(selected) === JSON.stringify(correct);

  const result = document.getElementById("result");
  result.style.display = "block";

  if (ok) {
    result.textContent = "✓ Correct";
  } else {
    result.textContent = `✗ Correct answer: ${correct.join(", ")}`;
  }
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

document.getElementById("checkBtn").onclick = checkAnswer;
document.getElementById("nextBtn").onclick = showQuestion;
document.getElementById("resetBtn").onclick = () => {
  if (confirm("Clear question history?")) {
    asked.clear();
    saveAsked();
    showQuestion();
  }
};

showQuestion();
